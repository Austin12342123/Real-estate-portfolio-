name: Device matrix (iPhone / iPad, WebKit)
# Separate from pages.yml (the Pages deploy). Runs on Linux only; WebKit is installed by Playwright itself. Not a merge gate yet: it reports failures as named tests.
on:
  push:
    branches: ['claude/m1-device-matrix', 'claude/m1f-device-matrix']
  pull_request:
    paths: ['tests/e2e/**', 'playwright.config.js', 'package.json', 'package-lock.json', '.github/workflows/device-matrix.yml', 'prototype/v4/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group:
          - { name: iphone-se-portrait, projects: '--project=iphone-se-portrait' }
          - { name: iphone-se-landscape, projects: '--project=iphone-se-landscape' }
          - { name: iphone-15-portrait, projects: '--project=iphone-15-portrait' }
          - { name: iphone-15-landscape, projects: '--project=iphone-15-landscape' }
          - { name: ipad-portrait, projects: '--project=ipad-portrait' }
          - { name: ipad-landscape-1, projects: '--project=ipad-landscape --shard=1/2' }
          - { name: ipad-landscape-2, projects: '--project=ipad-landscape --shard=2/2' }
          - { name: ipad-pro-portrait, projects: '--project=ipad-pro-portrait' }
          - { name: ipad-pro-landscape-1, projects: '--project=ipad-pro-landscape --shard=1/2' }
          - { name: ipad-pro-landscape-2, projects: '--project=ipad-pro-landscape --shard=2/2' }
          - { name: desktop, projects: '--project=desktop-1280 --project=desktop-1024 --project=desktop-768' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Run the device matrix (${{ matrix.group.name }})
        run: npx playwright test ${{ matrix.group.projects }} --workers=4
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.group.name }}
          path: test-results/
          retention-days: 7
