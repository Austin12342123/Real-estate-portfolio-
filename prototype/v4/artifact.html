/* end Manrope */
:root{--bg:#f4efe4;--card:#fbf8f1;--ink:#16130e;--mut:#5d584d;--line:#d8cfba;--acc:#2d4a86;--ok:#1d6b39;--warn:#8a5000;--bad:#a3261b;--flash:#f3e6a0;--bar:#e2d9c4;--field:#ebe4d2;--shd:0 1px 2px color-mix(in srgb,var(--ink) 8%,transparent),0 10px 28px color-mix(in srgb,var(--ink) 8%,transparent);--serif:Manrope,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--sans:Manrope,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--rs:12px;--rm:16px;--rl:22px;--rx:28px;--rp:999px;--gxs:4px;--gs:7px;--gm:10px;--gl:14px;--gxl:21px;--gxx:28px;--gsec:18px;--gpage:20px;--fxs:12px;--fs:13px;--fm:15px;--fl:18px;--fxl:25px;--fhero:46px}
:root[data-theme=dark]{color-scheme:dark;--bg:#12100d;--card:#1c1a16;--ink:#f3ede0;--mut:#aaa291;--line:#38332a;--acc:#9cb6ee;--ok:#5fd08a;--warn:#f0b050;--bad:#ff8d80;--flash:#5a4a00;--bar:#3a352c;--field:#2a2722;--shd:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent),0 10px 28px color-mix(in srgb,var(--ink) 4%,transparent)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#12100d;--card:#1c1a16;--ink:#f3ede0;--mut:#aaa291;--line:#38332a;--acc:#9cb6ee;--ok:#5fd08a;--warn:#f0b050;--bad:#ff8d80;--flash:#5a4a00;--bar:#3a352c;--field:#2a2722;--shd:0 1px 2px color-mix(in srgb,var(--ink) 6%,transparent),0 10px 28px color-mix(in srgb,var(--ink) 4%,transparent)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--sans);font-variant-numeric:tabular-nums}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
h1{font-size:28px;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer}
.ic{background:none;border:0;font-size:24px;color:var(--acc);min-width:44px;min-height:44px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:12px}.kpi b{font-size:var(--fl);display:block}.kpi .sub{font-size:11px;color:var(--mut)}.kpi .alt{display:block;font-size:11px;line-height:1.3;color:var(--mut);font-weight:400;margin-top:1px;overflow-wrap:anywhere}.unitnote{margin:6px 0 0}.unitnote .chip{margin-left:4px}
.bar{height:8px;background:var(--bar);border-radius:4px;margin:12px 0 4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px}
.bar i.over{background:var(--bad)}
.cap{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 4px 6px}
.row{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}
.r1,.r2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.r2{margin-top:4px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.addr{font-weight:600}.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;white-space:nowrap}
.pay{font-size:12px;color:var(--mut)}
.ex{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
.iw{display:inline-flex;align-items:center;background:var(--field);border-radius:8px;padding:0 8px;min-height:44px}
.iw em{font-style:normal;color:var(--mut)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;outline:0;min-width:0}
.iw input{width:92px;height:44px;text-align:right;padding:0 2px;font-weight:600}
.iw:focus-within{box-shadow:0 0 0 2px var(--acc)}
.calc .iw{background:transparent;border:1px dashed var(--line)}.calc .iw input{color:var(--mut);font-weight:400}
select{color:var(--acc);max-width:150px;min-height:44px}
.st{font-weight:600;white-space:nowrap}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.f{display:flex;align-items:center;justify-content:space-between;padding:2px 0;border-top:1px solid var(--line);min-height:48px}.f:first-of-type{border-top:0}
.lb i{color:var(--acc);font-style:normal;font-weight:700}
.note{font-size:12px;color:var(--mut);margin:4px 0 0}
.chip{display:inline-flex;align-items:center;min-height:44px;font-size:13px;background:var(--field);border-radius:12px;padding:2px 10px;margin:4px 6px 0 0;color:var(--mut);border:0}
.chip.link{color:var(--acc)}
.top{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.top h2{margin:0;font-size:var(--fl);flex:1}
.top input.t{font-size:20px;font-weight:700;width:100%;min-height:44px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 16px color-mix(in srgb,var(--ink) 6%,transparent)}
.bottom>div{max-width:430px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.btn{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600}
.btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--line);width:100%;margin-top:8px}
.btn.plain{background:var(--field);color:var(--ink);width:100%;margin-top:8px}
.seg{display:flex;background:var(--field);border-radius:8px;padding:2px;margin:8px 0}.seg button{flex:1;border:0;background:none;min-height:44px;border-radius:6px;font-size:13px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.cmp th{font-weight:500;color:var(--mut);text-align:right;padding:2px 0;font-size:12px}table.cmp th:first-child{text-align:left}
table.cmp td{padding:4px 0;border-top:1px solid var(--line);text-align:right}table.cmp td:first-child{text-align:left;color:var(--mut)}
.tlw{margin-top:4px}.tr{padding:8px 0 4px;cursor:pointer}.tl{font-size:13px}.tl b{color:var(--acc)}
.trk{position:relative;height:26px;margin:14px 0 2px}
.trk .tk{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.trk .tk span{position:absolute;top:-14px;left:-6px;font-size:10px;color:var(--mut)}
.seg2{position:absolute;top:8px;height:10px;background:var(--acc);border-radius:5px}
.seg2.pl{background:repeating-linear-gradient(45deg,var(--acc),var(--acc) 5px,color-mix(in srgb,var(--acc) 55%,var(--card)) 5px,color-mix(in srgb,var(--acc) 55%,var(--card)) 10px)}
.dot{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ok);border:3px solid var(--card)}
.nr{position:absolute;left:4px;top:3px;font-size:12px;color:var(--bad);font-weight:600}
.tm{font-size:12px;color:var(--mut)}.tm b{color:var(--ink)}
svg.nw{width:100%;height:auto;display:block;margin-top:6px}
svg.nw text{fill:var(--mut);font-size:9px}svg.nw .ln{fill:none;stroke:var(--acc);stroke-width:2}svg.nw .ar{fill:var(--acc);opacity:.12}
svg.nw .ax{stroke:var(--line);stroke-width:1}svg.nw circle{fill:var(--ok);stroke:var(--card);stroke-width:2}
.empty{text-align:center;padding:28px 8px;color:var(--mut)}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0 0}
@keyframes fl{from{background:var(--flash)}to{background:transparent}}
.flash{animation:fl .8s ease-out;border-radius:var(--rs)}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}

.kpi.sm b{font-size:var(--fm)}
.auto{font-style:normal;font-size:10px;font-weight:600;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:0 5px;margin-left:4px;vertical-align:1px}
.plan-line{margin:10px 0 0;font-size:var(--fs)}

          snap.forEach((x2) => {
            const jp0 = x2.h.jobPay,
              jp = jp0 === null || jp0 === undefined ? jp0 : jp0 * jfac;
            if (jp === null || jp === undefined || !(cap[x2.h.id] > 0.005)) return;
            want += jp;
            const give = Math.min(jp, cap[x2.h.id], J);
            if (give > 0) {
              JOBX[x2.h.id][t] += give;
              cap[x2.h.id] -= give;
              JLO[t] += give;
              J -= give;
            }
          });
          const fixedPaid = J0 - J;
          JSH[t] = Math.max(0, want - fixedPaid);
          let y = payLine(J);
          JLN[t] = J - y;
          if (pending) {
            C += y;
            JC[t] = y;
            y = 0;
          } else if (y > 0.005 && anyLoan) {
            const r = spread(
              y,
              snap.map((x2) => ({
                id: x2.h.id,
                w: x2.h.jobPay === null || x2.h.jobPay === undefined ? 1 : 0,
                cap: cap[x2.h.id] || 0,
              })),
            );
            Object.keys(r.got).forEach((id) => {
              JOBX[id][t] += r.got[id];
              cap[id] -= r.got[id];
              JLO[t] += r.got[id];
            });
            y = r.left;
          }
          JU[t] = J0 - y;
        }
        if (pp) {
          L +=
            inc -
            liv -
            dbt -
            Xu +
            port -
            (t > 0 ? reinv[t - 1] : 0) -
            JU[t] +
            intr +
            cI -
            oT -
            (out - outPrev) -
            SALET[t];
          LQ[t] = L;
        }
        outPrev = out;
        /* 4) next month's loan balances: the scheduled payment, your extra, and the automatic extra from the asset's own profit and from your job */
        for (const h of bought) {
          if (!held(h, t) || !(BAL[h.id][t] > 0.005) || t + 1 > TS) continue;
          /* a loan keeps running through the month an asset is sold: the sale pays off its balance */ setMonth(
            h,
            t + 1,
            Math.max(0, nextBal(h, t) - (AUTO[h.id][t] || 0) - (JOBX[h.id][t] || 0)),
          );
        }
      }
      blocked = qi < queue.length ? queue[qi] : null;
    }
    const keepBest =
      {}; /* the closest an unfunded asset got to its cash (recorded in the run where it blocked the queue; the final run leaves it out) */
    const settle = () => {
      for (let i = 0; i <= queue0.length + 1; i++) {
        run();
        if (!blocked) break;
        if (best[blocked.id]) keepBest[blocked.id] = best[blocked.id];
        skipped[blocked.id] = 1;
      }
    };
    settle();
    if (pp && g.autoPay !== false && CALLS.some((c) => c > 0.5)) {
      /* second pass: now the costs still to come are known, so loan payments never use up the cash they need */
      FUT = new Array(TS + 2).fill(0);
      for (let t = TS - 1; t >= 0; t--) FUT[t] = FUT[t + 1] + CALLS[t + 1];
      settle();
    }
    const sellKeys = hs.map((h) => (isFinite(sellAt[h.id]) ? sellAt[h.id] : 0)),
      mergeKeys = hs.map((h) => (isFinite(mergeAt[h.id]) ? mergeAt[h.id] : 0));
    const finiteBuys = hs.map((h) => P0[h.id]).filter(isFinite);
    const lastEvent = Math.max(0, ...finiteBuys, ...sellKeys, ...mergeKeys);
    const lastBuy = finiteBuys.length ? Math.max.apply(null, finiteBuys) : 0;
    const T = Math.min(TS, g.horizon, Math.max(120, lastEvent + 60, planM));
    const keys = [
      'nw',
      'monthly',
      'extra',
      'noi',
      'ds',
      'cf',
      'cfx',
      'debt',
      'value',
      'rent',
      'dsti',
      'dti',
      'count',
      'outside',
      'sav',
      'cash',
      'intr',
      'dep',
      'txRE',
      'txBiz',
    ];
    const s = {};
    keys.forEach((k) => (s[k] = new Array(T + 1).fill(0)));
    const dpCash = new Array(T + 1).fill(0),
      savA = new Array(T + 1).fill(0);
    for (let t = 1; t <= T; t++)
      dpCash[t] =
        reinv[
          Math.min(TS, t - 1)
        ]; /* pooled cash flow that moved into the trust (line paydown or cash) is no longer yours to spend */
    for (let t = 0; t <= T; t++) {
      let incAdd = 0,
        debtAdd = 0;
      for (const h of hs) {
        if (!held(h, t)) continue;
        const a = st(h, t);
        if (!a) continue;
        const { v } = a,
          hi = (a.heloc * hel) / 1200,
          sched = a.live ? PAY[h.id][t] + mipNow(h, a) : 0,
          ex = a.live ? v.X : 0,
          rentG = h.rent * a.gfi,
          reimbG = v.reimb * a.gfi;
        const intr = (a.live ? a.B * RAT[h.id][t] : 0) + hi,
          dep = depCum(S, h, a.depAge + 1) - depCum(S, h, a.depAge),
          tx = v.noi * a.gfi - intr - dep;
        s.intr[t] += intr;
        s.dep[t] += dep;
        if ((h.type || 'house') === 'business') s.txBiz[t] += tx;
        else s.txRE[t] += tx;
        s.count[t]++;
        s.value[t] += a.val;
        s.debt[t] += a.B + (h.liens || 0) + a.heloc;
        s.nw[t] += a.val - a.B - (h.liens || 0) - a.heloc;
        s.noi[t] += v.noi * a.gfi;
        s.ds[t] += sched + hi;
        s.extra[t] += ex;
        s.rent[t] += rentG;
        s.monthly[t] += sched + ex + v.escrow + hi;
        s.dsti[t] += sched + v.escrow + hi;
        const net = (g.rentCount / 100) * (rentG + reimbG) - (sched + v.escrow + hi);
        if (net >= 0) incAdd += net;
        else debtAdd += -net;
      }
      savA[t] = pp ? (t === 0 ? (+pp.cash || 0) - outsideA[0] : LQ[t]) : 0;
      s.nw[t] = netWorth(
        s.nw[t],
        savA[t],
        cashA[t],
      ); /* plan net worth = equity + your savings + the trust's cash, the same formula as today's (todayTotals). Month 0 = today's savings less what is paid out of them that month; later months = the plan's savings after every cost, so a purchase month drops net worth only by its closing costs */
      s.sav[t] = savA[t];
      s.cash[t] = cashA[t];
      s.outside[t] = outsideA[t];
      s.cf[t] = s.noi[t] - s.ds[t];
      s.cfx[t] = s.cf[t] - s.extra[t];
      const inc = (g.p1 + g.p2) / 12 + jobsGross(S, t) + incAdd,
        debts = g.otherDebt + housingAt(S, t) + debtAdd;
      s.dti[t] = inc > 0 ? Math.min(999, (debts / inc) * 100) : debts > 0 ? 999 : 0;
    }
    const at = (t) => {
      t = Math.max(0, Math.min(T, Math.round(t)));
      const o = { month: t };
      keys.forEach((k) => (o[k] = s[k][t]));
      o.cltv = o.value ? (o.debt / o.value) * 100 : 0;
      o.dscr = o.ds ? o.noi / o.ds : 0;
      return o;
    };
    /* every asset's contribution to the portfolio totals at month t; the entries sum exactly to the series values */
    const assetsAt = (t) => {
      t = Math.min(T, Math.round(t));
      const list = hs
        .map((h) => {
          if (!held(h, t)) return null;
          const a = st(h, t);
          if (!a) return null;
          const v = a.v,
            hi = (a.heloc * hel) / 1200,
            sched = a.live ? PAY[h.id][t] + mipNow(h, a) : 0,
            ex = a.live ? v.X : 0,
            inc = v.noi * a.gfi;
          return {
            id: h.id,
            addr: h.addr,
            type: h.type || 'house',
            equity: a.val - a.B - (h.liens || 0) - a.heloc,
            value: a.val,
            debt: a.B + (h.liens || 0) + a.heloc,
            payment: sched + ex + v.escrow + hi,
            cf: inc - sched - hi,
            income: inc,
            extra: ex,
          };
        })
        .filter(Boolean);
      if (Math.abs(savA[t]) > 0.5)
        list.push({
          id: '__savings',
          addr: 'Your savings',
          type: 'cash',
          equity: savA[t],
          value: 0,
          debt: 0,
          payment: 0,
          cf: 0,
          income: 0,
        });
      if (s.cash[t] > 0.5)
        list.push({
          id: '__cash',
          addr: 'Cash in the trust',
          type: 'cash',
          equity: s.cash[t],
          value: s.cash[t],
          debt: 0,
          payment: 0,
          cf: 0,
          income: 0,
        });
      return list;
    };
    /* the pool at the END of month t: how many assets, borrowing room, line drawn, room left, pooled monthly cash flow, cash held */
    const poolAt = (t) => {
      t = Math.max(0, Math.min(TS, Math.round(t)));
      const sn = [];
      for (const h of bought) {
        if (!held(h, t)) continue;
        const a = st(h, t);
        if (!a) continue;
        const v = a.v,
          hi = (a.heloc * hel) / 1200,
          sched = a.live ? PAY[h.id][t] + mipNow(h, a) : 0;
        sn.push({
          inc: v.noi * a.gfi,
          sched,
          hi,
          draw: a.heloc,
          biz: (h.type || 'house') === 'business',
          live: t < mergeAt[h.id],
          tx:
            v.noi * a.gfi -
            ((a.live ? a.B * RAT[h.id][t] : 0) + hi) -
            (depCum(S, h, a.depAge + 1) - depCum(S, h, a.depAge)),
          room: Math.max(0, (capOf(S, h) / 100) * (1 - g.haircut / 100) * a.val - a.B - (h.liens || 0)),
        });
      }
      const m = sumSnap(sn, t);
      return {
        month: t,
        n: m.n,
        room: m.room,
        drawn: m.draw,
        head: Math.max(0, m.head),
        cf: m.cf,
        tax: m.tax,
        gm: m.gm,
        sweep: m.sweep,
        cash: cashA[t],
      };
    };
    const order = queue0.filter((h) => !skipped[h.id]).concat(queue0.filter((h) => skipped[h.id]));
    const funds = {};
    hs.forEach((h) => {
      funds[h.id] = !!(fund[h.id] && fund[h.id].pool);
    });
    const trust = {};
    let prevM = 0;
    hs.forEach((h) => {
      if (h.status === 'owned') return;
      const m = P0[h.id],
        f = fund[h.id] || null,
        bi = Math.max(0, Math.round(h.buyIn || 0)),
        rd = readyAt[h.id] === undefined ? Infinity : readyAt[h.id];
      /* month = the one clock everywhere: months from today. ready = the first month the pool could pay (room + cash >= need); month = ready, or the 'not before' month if that is later (held = true). */
      trust[h.id] = {
        month: m,
        ready: rd,
        held: isFinite(m) && isFinite(rd) && m > rd,
        buyIn: bi,
        ok: isFinite(m),
        pooled: funds[h.id],
        n: f ? f.n : 0,
        room: f ? f.room : 0,
        cf: f ? f.cf : 0,
        cash: f ? f.cash : 0,
        draw: f ? f.draw : 0,
        heldCash: f ? f.heldCash : 0,
        have: f ? f.have : 0,
        need: f ? f.need : needFor(S, h),
        savings: f ? f.savings || 0 : 0,
        rsv: f ? f.rsv || 0 : 0,
        gross: f ? f.gross : 0,
        best: best[h.id] || keepBest[h.id] || null,
      };
    });
    /* loans: balance at any month, and the month each loan is paid off (with the extra from your own profit and your job); 0 = no loan, Infinity = not within the plan horizon */
    const loanEnd = {},
      balAt = (id, t) => (BAL[id] ? BAL[id][Math.max(0, Math.min(TS, Math.round(t)))] || 0 : 0);
    hs.forEach((h) => {
      const p = P0[h.id];
      if (!isFinite(p)) {
        loanEnd[h.id] = Infinity;
        return;
      }
      let e = Infinity;
      for (let t = p; t <= TS; t++)
        if (!(BAL[h.id][t] > 0.005)) {
          e = t;
          break;
        }
      loanEnd[h.id] = e;
    });
    const shareAt = (A) => (id, t) => (A[id] ? A[id][Math.max(0, Math.min(TS, Math.round(t)))] || 0 : 0);
    const firstPos = (A) => (id) => {
      const a = A[id];
      if (!a) return -1;
      for (let t = 0; t <= TS; t++) if (a[t] > 0.005) return t;
      return -1;
    };
    const jobs = {
      short: JSH.slice(0, T + 1),
      surplus: JS.slice(0, T + 1),
      used: JU.slice(0, T + 1),
      line: JLN.slice(0, T + 1),
      cash: JC.slice(0, T + 1),
      loans: JLO.slice(0, T + 1),
      credit: JCR.slice(0, T + 1),
      liquid: LQ.slice(0, T + 1),
    };
    const rows = queue0.map((h) => {
      const m = P0[h.id],
        r = {
          id: h.id,
          target: h.id,
          start: prevM,
          locM: isFinite(m) ? Math.max(0, m - prevM) : Infinity,
          end: m,
          ok: isFinite(m),
          funds: funds[h.id],
          ready: trust[h.id].ready,
        };
      if (isFinite(m)) prevM = Math.max(prevM, m);
      return r;
    });
    let worst = { dti: 0, month: 0 };
    for (let t = 0; t <= T; t++) if (s.dti[t] > worst.dti) worst = { dti: s.dti[t], month: t };
    let extraLater = 0;
    hs.forEach((h) => {
      const v = V[h.id];
      if (isFinite(P0[h.id]) && P0[h.id] > 0 && v.L > 0 && v.payoff > 0) extraLater += v.X;
    });
    const res = {
      dpCash,
      jobUsed: jobs.used,
      outsideTotal: s.outside[T],
      extraNow: s.extra[0],
      extraLater,
      purchase: P0,
      sellAt,
      mergeAt,
      exits,
      series: s,
      T,
      lastBuy,
      lastEvent,
      planM: Math.min(T, planM),
      today: at(0),
      final: at(Math.min(T, lastEvent)),
      horizon: at(Math.min(T, planM)),
      saleTaxPersonal: SALET.slice(0, T + 1) /* sale tax the proceeds could not cover (comes out of savings) */,
      at,
      assetsAt,
      poolAt,
      snap: assetsAt(Math.min(T, planM)),
      rows,
      jobs,
      loanEnd,
      balAt,
      autoAt: shareAt(AUTO),
      jobAt: shareAt(JOBX),
      autoFrom: firstPos(AUTO),
      jobFrom: firstPos(JOBX),
      funds,
      fundedByLOC: funds,
      trust,
      V,
      worst,
      unfunded: hs.filter((h) => !isFinite(P0[h.id])).map((h) => h.id),
      skipped: Object.keys(skipped),
      queue: order.map((h) => h.id),
    };
    /* CASH PROFIT of a sold asset = what the sale leaves in cash (sale price - selling costs - the loan and liens paid off) - the tax on the sale - the cash you put in (down payment + closing costs + improvements paid in cash). exits[id].profit; a loss is negative. */
    hs.forEach((h) => {
      const ex = exits[h.id];
      if (!ex) return;
      const sx = saleTax(S, res, h);
      ex.tax = sx ? sx.tax : 0;
      ex.cashIn = needFor(S, h);
      ex.profit = ex.proceeds - ex.tax - ex.cashIn;
    });
    return res;
  }

  /* ---------- TODAY'S DOLLARS ----------
     The engine always works in future (nominal) dollars: rents, values and living costs grow, loan payments are fixed, and a planned asset's price is TODAY'S price (nothing is inflated).
     For display, every figure that belongs to a future month is divided by (1 + cost-increase rate)^(months / 12), the same rate living costs rise at (Finances, "Cost increase"). Figures for month 0 are unchanged.
     realPlan() returns the plan with every dollar figure of a future month converted that way (totals and rows are converted with the same factor, so a total is still the sum of its rows). The plan itself stays in pl.raw. */
  const dfac = (S, m) => Math.pow(1 + ((S && S.p && S.p.inflation) || 0) / 100, Math.max(0, +m || 0) / 12);
  const PL_K = [
    'nw',
    'monthly',
    'extra',
    'noi',
    'ds',
    'cf',
    'cfx',
    'debt',
    'value',
    'rent',
    'dsti',
    'outside',
    'cash',
    'sav',
    'intr',
    'dep',
    'txRE',
    'txBiz',
  ];
  const AS_K = ['equity', 'value', 'debt', 'payment', 'cf', 'income', 'extra'],
    PO_K = ['room', 'drawn', 'head', 'cf', 'tax', 'gm', 'sweep', 'cash'],
    EX_K = ['proceeds', 'price', 'net', 'dep', 'cost', 'tax', 'cashIn', 'profit'],
    JB_K = ['short', 'surplus', 'used', 'line', 'cash', 'loans', 'liquid'];
  const scaleKeys = (o, ks, f) => {
    const c = Object.assign({}, o);
    ks.forEach((k) => {
      if (typeof c[k] === 'number') c[k] = c[k] / f;
    });
    return c;
  };
  function realPlan(S, pl) {
    if (!pl) pl = plan(S);
    if (pl.raw) return pl;
    const T = pl.T,
      f = (m) => dfac(S, m),
      r = Object.assign({}, pl, { raw: pl, real: true });
    r.series = Object.assign({}, pl.series);
    PL_K.forEach((k) => {
      r.series[k] = pl.series[k].map((v, t) => v / f(t));
    });
    r.at = (t) => {
      const o = scaleKeys(pl.at(t), PL_K, f(Math.max(0, Math.min(T, Math.round(t)))));
      return o;
    };
    r.today = r.at(0);
    r.final = r.at(Math.min(T, pl.lastEvent));
    r.horizon = r.at(Math.min(T, pl.planM));
    r.assetsAt = (t) => {
      const k = f(Math.max(0, Math.min(T, Math.round(t))));
      return pl.assetsAt(t).map((x) => scaleKeys(x, AS_K, k));
    };
    r.snap = r.assetsAt(Math.min(T, pl.planM));
    r.poolAt = (t) => scaleKeys(pl.poolAt(t), PO_K, f(Math.max(0, Math.min(T, Math.round(t)))));
    r.exits = {};
    Object.keys(pl.exits).forEach((id) => {
      r.exits[id] = scaleKeys(pl.exits[id], EX_K, f(pl.exits[id].month));
    });
    r.outsideTotal = pl.outsideTotal / f(T);
    r.balAt = (id, t) => pl.balAt(id, t) / f(t);
    r.autoAt = (id, t) => pl.autoAt(id, t) / f(t);
    r.jobAt = (id, t) => pl.jobAt(id, t) / f(t);
    r.jobs = Object.assign({}, pl.jobs);
    JB_K.forEach((k) => {
      if (pl.jobs[k]) r.jobs[k] = pl.jobs[k].map((v, t) => v / f(t));
    });
    return r;
  }
  const planR = (S) => realPlan(S, plan(S));
  /* the same plan in future dollars or today's dollars: u = 'today' (default) | 'future' */
  const planIn = (S, u) => (u === 'future' ? plan(S) : planR(S));

  /* "Lasts" stress test for one category (rows = plan-end snapshot rows of that category): if about 45% of the assets (the biggest earners) stop earning, rent/profit is gone but the
     fixed costs (tax, insurance, HOA) and the loan payments are still due. Everything is at plan-end values: the fixed costs grow with the asset exactly as its income does (income / today's NOI). */
  function stress(S, pl, rows, cash) {
    const income = rows.reduce((a, x) => a + x.income, 0),
      cf = rows.reduce((a, x) => a + x.cf, 0),
      worth = rows.reduce((a, x) => a + x.value, 0),
      ds = income - cf;
    const costOf = (x) => {
      const h = H(S, x.id),
        v = pl.V[x.id];
      if (!h || !v) return 0;
      const g = Math.abs(v.noi) > 1e-9 ? x.income / v.noi : 1;
      return ((+h.tax || 0) + (+h.ins || 0) + (+h.hoa || 0)) * g;
    };
    const k = Math.max(1, Math.round(rows.length * 0.45)),
      lostOf = (x) => x.income + costOf(x),
      byLoss = rows.slice().sort((a, b) => lostOf(b) - lostOf(a));
    const partial = cf - byLoss.slice(0, k).reduce((a, x) => a + lostOf(x), 0),
      allFail = -(ds + rows.reduce((a, x) => a + costOf(x), 0));
    const useAll = partial >= 0,
      burn = useAll ? allFail : partial,
      c = Math.max(0, cash || 0);
    return {
      income,
      cf,
      worth,
      ds,
      dscr: ds > 0.5 ? income / ds : null,
      k,
      partial,
      allFail,
      useAll,
      burn,
      months: burn >= -0.5 ? Infinity : c <= 0 ? 0 : c / -burn,
    };
  }

  /* Can you afford the plan? Rolls your personal cash forward month by month on top of the portfolio plan. */
  /* month N is written 'month N (Mon YYYY)' in the browser (the app supplies the calendar through window.RepDate); month 0 is always 'today' */
  const mAt = (m) =>
      m <= 0
        ? 'today'
        : m +
          (m === 1 ? ' month' : ' months') +
          ' from today' +
          (root.RepDate && root.RepDate.dtm ? ' (' + root.RepDate.dtm(m) + ')' : ''),
    inM = (m) => mAt(m),
    aroundM = (m) => (m <= 0 ? 'today' : 'around ' + mAt(m));
  function finance(S, pl) {
    const p = S.p;
    if (!p) return null;
    pl = pl || plan(S);
    const real = !!pl.raw;
    if (real)
      pl =
        pl.raw; /* a plan in today's dollars: work it all out in future dollars, then show every figure in today's (see the end of this function) */
    const g = S.g,
      s = pl.series,
      T = pl.T,
      infl = (p.inflation || 0) / 100,
      apy = (p.cashApy || 0) / 1200;
    const N = (n) => new Array(n + 1).fill(0);
    const R = {
      dep: N(T),
      taxable: N(T),
      gm: N(T),
      hours: N(T),
      nBiz: N(T),
      income: N(T),
      portfolio: N(T),
      portTax: N(T),
      extra: N(T),
      living: N(T),
      debts: N(T),
      oneTime: N(T),
      capitalIn: N(T),
      jobSplit: N(T),
      jobSurplus: N(T),
      outsideCall: N(T),
      saleTax: N(T),
      interest: N(T),
      net: N(T),
      liquid: N(T),
      total: N(T),
      reserve: N(T),
      burn: N(T),
      runway: N(T),
    };
    const saleInfo = {};
    S.houses.forEach((h) => {
      const ex = pl.exits[h.id];
      if (ex && ex.month <= T) {
        const st0 = saleTax(S, pl, h);
        saleInfo[h.id] = st0;
        R.saleTax[ex.month] += st0.tax;

      avail = poolCf + noi + personal,
      absorb = fin
        ? Math.max(0, fin.series.net[mi2] / dfm, poolCf + personal)

    const cs = [],
      add = (c) => {
        cs.push(c);
        return c;
      };
    /* 1) funding */
    const pc = Math.round(planM * FEAS.pace);
    const how1 =
      'needs ' +
      fm(need) +
      ' (down ' +
      fm(down) +
      ' + closing ' +
      fm(closing) +
      (rehab > 0 ? ' + rehab ' + fm(rehab) : '') +
      '); can pull out ' +
      fm(have) +
      ' (' +
      (pooled ? 'room ' + fm(room) + ' + trust cash ' + fm(tcash) : 'savings above the cushion ' + fm(sav)) +
      ')' +
      (ok ? ' by ' + mAt(m0) : '');
    if (!ok)
      add(
        mkC(
          'funding',
          'Cash to close',
          'fail',
          fm(have) + ' of ' + fm(need),
          'needs ' + fm(need),
          how1 + ' - the plan never reaches it',
          {
            hard: true,
            kind: 'nofund',
            text: 'Not possible: needs ' + fm(need) + ', the plan never reaches it',
            short: 'Not possible - short ' + fm(cashShort),
          },
        ),
      );
    else if (m0 > planM)
      add(
        mkC('funding', 'Cash to close', 'fail', mAt(m0), 'by ' + mAt(planM), how1, {
          hard: true,
          kind: 'nofund',
          text: 'Not possible: funded only ' + inM(m0) + ', after the ' + yrs + '-year plan ends',
          short: 'Not possible - funded only ' + inM(m0),

    else if (m0 > pc)
      add(
        mkC('funding', 'Cash to close', 'caution', mAt(m0), 'by ' + mAt(pc), how1, {
          kind: 'nofund',
          text: 'Late: funded only ' + inM(m0) + ', near the end of the ' + yrs + '-year plan',
          short: 'Late - funded ' + inM(m0),

    const dmin = dscrMinOf(h),
      hasLoan = L > 0.5 && pay > 0.5,
      dscr = hasLoan ? noi / pay : Infinity;
    if (!hasLoan)
      add(mkC('dscr', 'Loan DSCR', 'ok', 'no loan', '', 'No loan on this asset, so no lender test.'));
    else
      add(
        mkC(
          'dscr',
          'Loan DSCR',
          dscr < dmin - FEAS.dscrNear ? 'fail' : dscr < dmin + FEAS.dscrNear ? 'caution' : 'ok',
          dscr.toFixed(2),
          'min ' + dmin,
          'income ' +
            fm(noi) +
            '/mo / loan payment ' +
            fm(pay) +
            '/mo = ' +
            dscr.toFixed(2) +
            ' vs the ' +
            dmin +
            ' this loan wants',
          {
            hard: dscr < dmin - FEAS.dscrNear,
            kind: 'nolender',
            text:
              (dscr < dmin - FEAS.dscrNear ? 'Not possible: ' : '') +
              "the loan's DSCR is " +
              dscr.toFixed(2) +

              dmin +
              ' the lender wants',
            short:
              (dscr < dmin - FEAS.dscrNear ? 'Not possible - ' : 'Tight - ') +
              'DSCR ' +
              dscr.toFixed(2) +
              ' vs ' +
              dmin,
          },

      );
    const pre = loanById(h.loanId),
      ltv = baseAmt(h) > 0 && hasLoan ? (L / (1 + (h.mipUp || 0) / 100) / baseAmt(h)) * 100 : 0,
      ltvMax = pre && pre.dp < 100 ? 100 - pre.dp : null;
    if (ltvMax === null || !hasLoan)
      add(
        mkC(
          'ltv',
          'Loan-to-value',
          'ok',
          hasLoan ? ltv.toFixed(0) + '%' : 'no loan',
          '',
          hasLoan ? 'Custom loan: no program limit to test.' : 'No loan on this asset.',
        ),
      );
    else
      add(
        mkC(
          'ltv',
          'Loan-to-value',
          ltv > ltvMax + 0.01 ? 'fail' : 'ok',
          ltv.toFixed(0) + '%',
          'max ' + ltvMax + '%',
          'loan ' +
            fm(L) +
            ' / price ' +
            fm(baseAmt(h)) +
            ' = ' +
            ltv.toFixed(0) +
            '% vs the ' +
            ltvMax +
            '% the ' +
            pre.name +
            ' lends',
          {
            hard: ltv > ltvMax + 0.01,
            kind: 'nolender',
            text:
              'Not possible: the loan is ' +
              ltv.toFixed(0) +
              '% of the price, over the ' +
              ltvMax +
              '% this loan lends',
            short: 'Not possible - LTV ' + ltv.toFixed(0) + '% over ' + ltvMax + '%',
          },
        ),
      );
    const cap = FEAS.loanMax[h.loanId];
    add(
      cap
        ? mkC(
            'loanmax',
            'Loan size limit',
            L > cap ? 'fail' : 'ok',
            fm(L),
            'max ' + fm(cap),
            'loan ' + fm(L) + ' vs the ' + fm(cap) + ' this program stops at',
            {
              hard: L > cap,
              kind: 'nolender',
              text: 'Not possible: the loan is ' + fm(L) + ', over the ' + fm(cap) + ' limit of this program',
              short: 'Not possible - loan over ' + fm(cap),

          )
        : mkC(
            'loanmax',
            'Loan size limit',
            'ok',
            hasLoan ? fm(L) : 'no loan',
            'none',
            'This loan has no program size limit in the app.',
          ),
    );
    const dti = pl.series.dti[mi2],
      dl = g.dti;
    add(
      mkC(
        'dti',
        'Total debt-to-income',
        dti >= 999 ? 'fail' : dti > dl ? 'fail' : dti > FEAS.dtiCaution * dl ? 'caution' : 'ok',
        dti >= 999 ? 'no income' : dti.toFixed(0) + '%',
        'max ' + dl + '%',
        'all debt payments incl. this loan and your own housing / qualifying income = ' +
          (dti >= 999 ? 'no qualifying income set' : dti.toFixed(0) + '%') +
          ' ' +
          (ok ? 'when it closes' : 'at the closest month') +
          ' vs ' +
          dl +
          '%',
        {
          hard: dti > dl,
          kind: 'nolender',
          text:
            dti >= 999

                dti.toFixed(0) +

                '%)',
          short:
            dti >= 999

    );
    /* 3) reserves after closing, 4) income fit */
    if (fin) {

        runw = fin.series.runway[mi2];
      add(
        mkC(
          'reserve',
          'Reserves after closing',

          'keep ' + fm(rsv / dfm),
          'cash after closing ' +
            fm(tot / dfm) +
            ' vs the ' +
            ((S.p && S.p.emergencyMonths) || 0) +

            fm(rsv / dfm) +
            " (today's dollars)",
          {
            kind: 'nocashflow',
            text:

            short: 'Tight - cash below your reserve',
          },
        ),
      );
      add(
        mkC(
          'runway',
          'If the paycheck stops',
          runw < FEAS.runFail ? 'fail' : runw < FEAS.runCaution ? 'caution' : 'ok',
          isFinite(runw) ? runw.toFixed(1) + ' mo' : 'covered',
          'at least ' + FEAS.runCaution + ' mo',
          isFinite(runw)
            ? 'cash ' +
                fm(tot / dfm) +
                ' / monthly burn without the job = ' +
                runw.toFixed(1) +
                ' months of runway'
            : 'portfolio income covers your bills without the job',
          {
            kind: 'nocashflow',
            text:
              'If your paycheck stopped, cash would last only ' +
              (isFinite(runw) ? runw.toFixed(1) : '0') +
              ' months',
            short: 'Tight - thin runway',
          },
        ),
      );
    }
    add(
      mkC(
        'carry',
        'Monthly: carry the payment',
        hasLoan && avail < pay - 0.5 ? 'fail' : 'ok',
        fm(avail) + '/mo',
        'needs ' + fm(pay) + '/mo',
        'payment ' +
          fm(pay) +
          '/mo; available ' +
          fm(avail) +
          '/mo = asset income ' +
          fm(noi) +
          ' + pool cash flow ' +
          fm(poolCf) +
          (personal > 0 ? ' + your monthly surplus ' + fm(personal) : ''),
        {
          hard: hasLoan && avail < pay - 0.5,
          kind: 'nocashflow',
          text:
            'Not possible: the loan payment is ' +
            fm(pay) +
            '/mo but only ' +
            fm(avail) +
            '/mo is available to carry it',
          short: 'Not possible - short ' + fm(pay - avail) + '/mo',

    /* 5) deal quality */
    const lose = v.cf < -0.5,
      absorbed = -v.cf <= absorb + 0.5;
    if (type === 'house' && lose)

        mkC(
          'cashflow',
          'Cash flow after the loan',
          'fail',
          sgn(v.cf) + '/mo',
          'not below $0',
          'income ' + fm(noi) + ' - payment ' + fm(pay) + ' = ' + sgn(v.cf) + '/mo',
          {
            hard: true,
            kind: 'nocashflow',
            text:
              'Not possible: a home must never lose money, and this one is ' +
              sgn(v.cf) +
              '/mo after the loan',
            short: 'Not possible - loses ' + fm(-v.cf) + '/mo',
          },

    else
      add(
        mkC(
          'cashflow',
          'Cash flow after the loan',
          lose && !absorbed ? 'caution' : 'ok',
          sgn(v.cf) + '/mo',
          type === 'house' ? 'not below $0' : 'covered by the pool',
          'income ' +
            fm(noi) +
            ' - payment ' +
            fm(pay) +
            ' = ' +
            sgn(v.cf) +
            '/mo' +
            (lose
              ? '; the pool (' + fm(absorb) + '/mo) ' + (absorbed ? 'covers it' : 'cannot cover it')

          {
            kind: 'nocashflow',
            text: 'The asset loses ' + fm(-v.cf) + '/mo after its loan and the pool cannot cover it',

        ),

    const capR = v.capRate;
    add(
      mkC(
        'cap',
        'Cap rate vs price',
        price > 0 && !(capR >= FEAS.capMin) ? 'caution' : 'ok',
        isFinite(capR) ? capR.toFixed(1) + '%' : '-',
        'at least ' + FEAS.capMin + '%',
        'income ' +
          fm(noi * 12) +
          '/yr / price ' +
          fm(price) +
          ' = ' +
          (isFinite(capR) ? capR.toFixed(1) : '0') +

                  fm(noi) +

            'balloon',
            'Balloon / refinance',
            'ok',
            'none',
            '',

    const lossV =

        'stress-rate',
        'Stress: rate +' + FEAS.ratePts + ' pts',

        hasLoan ? sgn(cfR) + '/mo' : 'no loan',
        'not below what the pool covers',
        hasLoan

              fm(noi) +
              ' - payment at ' +
              (h.rate + FEAS.ratePts) +
              '% ' +
              fm(payR) +
              ' = ' +
              sgn(cfR) +
              '/mo'
          : 'No loan, so a higher rate changes nothing.',
        {
          kind: 'nocashflow',
          text: 'If the rate were ' + FEAS.ratePts + ' points higher it would lose ' + fm(-cfR) + '/mo',
          short: 'Tight - weak if rates rise',
        },
      ),
    );
    /* 7) concentration */
    const totP = S.houses.reduce((a, q) => a + (+q.price || 0), 0),

    add(

        'concentration',
        'Concentration',

        share.toFixed(0) + '% of value',

        'price ' +
          fm(price) +
          ' / all assets ' +
          fm(totP) +
          ' = ' +
          share.toFixed(0) +
          '%' +
          (nA < FEAS.concMin ? ' (not tested with fewer than ' + FEAS.concMin + ' assets)' : ''),

          kind: 'nocashflow',
          text: 'One asset is ' + share.toFixed(0) + '% of the portfolio by value',

    return {

      addr: h.addr,
      verdict,
      kind,
      criteria: cs,
      reasons,
      top: top,
      short: top ? top.short : '',

      cash: {
        need,
        down,
        closing,
        rehab,
        have,
        savings: sav,
        trustCash: tcash,
        room,
        pooled,
        short: cashShort,
        uncovered,
        month: ok ? m0 : bm,
        closest: !ok,

        payment: pay,
        poolCf,
        asset: noi,
        personal,
        available: avail,
        short: avail - pay,
        covered: avail >= pay - 0.5,

  }
  function feasible(S, pl, fin, inner) {

          ? mkC(

              'Every planned asset can be funded',

              'all funded',
              nUn +
                ' planned asset' +
                (nUn === 1 ? '' : 's') +
                ' never reach the cash they need within the plan',
              {
                hard: true,
                kind: 'nofund',
                text:
                  nUn +
                  ' of ' +
                  nPl +
                  ' planned asset' +
                  (nUn === 1 ? '' : 's') +
                  ' cannot be funded in the plan',
                short: nUn + ' cannot be funded',
              },
            )

              'p-funding',
              'Every planned asset can be funded',
              late ? 'fail' : pl.lastBuy > FEAS.pace * pl.planM ? 'caution' : 'ok',
              nPl ? 'last ' + inM(pl.lastBuy) : 'none planned',
              'by ' + mAt(pl.planM),

              {

                kind: 'nofund',
                text: late

                short: late ? 'Not possible - last purchase after the plan' : 'Late purchases',

      mkC(
        'p-dti',
        'Debt-to-income peak',

            '% of income ' +
            inM(pl.worst.month) +
            ' (limit ' +

            '%)',
          short: 'Lenders may decline',
        },
      ),
    );
    const cl = pl.at(Math.min(T, pl.lastBuy)).cltv;
    if (nPl)
      add(
        mkC(

          'Debt vs value',
          cl > g.cap + 0.5 ? 'fail' : 'ok',
          cl.toFixed(0) + '%',
          'max ' + g.cap + '%',
          'all debt / all value when the last asset is bought = ' +
            cl.toFixed(0) +
            '% vs the ' +
            g.cap +
            '% cap',
          {

            kind: 'nolender',
            text: 'Total debt is ' + cl.toFixed(0) + '% of value, over the ' + g.cap + '% cap',
            short: 'Debt over the cap',
          },
        ),
      );
    if (fin) {
      const k = fin.kpis;
      add(
        mkC(
          'p-cash',
          'Cash never runs out',
          k.minLiquid < 0 ? 'fail' : k.reserveGap > 0.5 ? 'caution' : 'ok',
          k.minLiquid < 0 ? 'short ' + fm(-k.minLiquid) : 'lowest ' + fm(Math.max(0, k.minLiquid)),
          'above the reserve',
          k.minLiquid < 0
            ? 'your cash is about ' +
                fm(-k.minLiquid) +
                ' short at its lowest point, ' +
                mAt(k.minLiquidMonth)
            : 'lowest cash ' + fm(k.minLiquid) + '; reserve gap ' + fm(k.reserveGap),
          {
            hard: k.minLiquid < 0,

            text:
              k.minLiquid < 0

                : 'Your cash dips below your emergency reserve',
            short: k.minLiquid < 0 ? 'Cash runs out' : 'Cash below reserve',
          },
        ),
      );
      add(
        mkC(
          'p-runway',
          'If the paycheck stops',
          k.minRunway < FEAS.runFail ? 'fail' : k.minRunway < FEAS.runCaution ? 'caution' : 'ok',
          isFinite(k.minRunway) ? k.minRunway.toFixed(1) + ' mo' : 'covered',
          'at least ' + FEAS.runCaution + ' mo',
          'lowest runway over the plan',
          { kind: 'nocashflow', text: 'Little cushion if your paycheck stops', short: 'Thin runway' },
        ),
      );
      add(
        mkC(
          'p-hours',
          'Hours in a week',
          k.peakHours > 70 ? 'caution' : 'ok',
          Math.round(k.peakHours) + ' h',
          'under 70 h',
          'job + businesses you run at the busiest month',
          {
            kind: 'nocashflow',

            short: 'Too many hours',

        ),

    }
    const cats = ['house', 'commercial', 'business'],
      lasts = [];
    cats.forEach((tp) => {
      const rows = pl.snap.filter(
        (x) => x.type === tp && S.houses.some((q) => q.id === x.id && q.status !== 'owned'),
      );
      if (!rows.length) return;
      const cash = fin ? Math.max(0, fin.series.total[pe] || 0) : 0,
        st = stress(S, pl, rows, cash);
      lasts.push({ tp, months: st.burn >= -0.5 ? Infinity : st.months });
    });
    const w = lasts.sort((a, b) => a.months - b.months)[0];
    if (w)
      add(
        mkC(
          'p-earners',
          'Stress: biggest earners lost',
          w.months < FEAS.lastsFail ? 'fail' : w.months < FEAS.lastsCaution ? 'caution' : 'ok',
          isFinite(w.months) ? w.months.toFixed(1) + ' mo' : 'covered',
          'at least ' + FEAS.lastsCaution + ' mo',
          'cash lasts this long if about 45% of the biggest ' + w.tp + ' earners stop paying',
          {
            kind: 'nocashflow',
            text:
              'If your biggest earners stopped, cash would last ' +
              (isFinite(w.months) ? w.months.toFixed(1) : 0) +
              ' months',
            short: 'Weak if big earners stop',
          },
        ),
      );
    const totP = S.houses.reduce((a, q) => a + (+q.price || 0), 0),
      big = S.houses.slice().sort((a, b) => b.price - a.price)[0],
      sh = big && totP > 0 ? (big.price / totP) * 100 : 0;
    if (nPl)
      add(
        mkC(
          'p-concentration',
          'Concentration',
          S.houses.length >= FEAS.concMin && sh > FEAS.concFail
            ? 'fail'
            : S.houses.length >= FEAS.concMin && sh > FEAS.concCaution
              ? 'caution'
              : 'ok',
          sh.toFixed(0) + '% in one',
          'under ' + FEAS.concCaution + '%',
          big
            ? 'biggest asset ' + fm(big.price) + ' / all assets ' + fm(totP) + ' = ' + sh.toFixed(0) + '%'
            : 'no assets',
          {
            kind: 'nocashflow',
            text: (big ? big.addr : 'One asset') + ' is ' + sh.toFixed(0) + '% of the portfolio by value',
            short: 'Concentrated',
          },
        ),
      );
    const aList = planned.map((h) => assets[h.id]),
      rank = { yes: 0, tight: 1, no: 2 };
    const pHard = cs.filter((c) => c.hard && c.status === 'fail'),
      pBad = sortC(cs).filter((c) => c.status !== 'ok');
    let verdict = !nPl ? 'yes' : pHard.length ? 'no' : pBad.length ? 'tight' : 'yes';
    /* nothing planned = nothing to grade: owned assets are judged on Real, never 'Not yet' */ aList.forEach(
      (a) => {
        if (rank[a.verdict] > rank[verdict]) verdict = a.verdict;
      },
    );
    /* reasons: the most important first. A planned asset that cannot be funded or financed leads, in buy order, then the portfolio checks, then the assets that are only tight */
    const reasons = [],
      seen = {},
      push = (r) => {
        const k = r.text;
        if (!seen[k]) {
          seen[k] = 1;
          reasons.push(r);
        }
      };
    aList
      .filter((a) => a.verdict === 'no')
      .sort((a, b) => KRANK[a.kind] - KRANK[b.kind])
      .forEach((a) => {
        const c = sortC(a.criteria).find((x) => x.hard && x.status === 'fail');
        push({
          sev: 'bad',
          id: c.id,
          asset: a.id,
          text: (a.addr ? a.addr + ' - ' : '') + c.text,
          short: c.short,
          kind: a.kind,
        });
      });
    pBad
      .filter((c) => c.status === 'fail')
      .forEach((c) => push({ sev: 'bad', id: c.id, text: c.text, short: c.short, kind: c.kind }));
    aList
      .filter((a) => a.verdict === 'tight')
      .forEach((a) => {
        const c = a.top;
        if (c)
          push({
            sev: 'warn',
            id: c.id,
            asset: a.id,
            text: (a.addr ? a.addr + ' - ' : '') + c.text,
            short: c.short,
            kind: c.kind,
          });
      });
    pBad
      .filter((c) => c.status === 'caution')
      .forEach((c) => push({ sev: 'warn', id: c.id, text: c.text, short: c.short, kind: c.kind }));
    if (!nPl) reasons.length = 0;
    const first = reasons[0] || null,
      nNo = aList.filter((a) => a.verdict === 'no').length;
    const headline = !nPl
      ? 'Nothing planned yet.'
      : verdict === 'yes'
        ? 'Yes. You can carry this plan.'
        : verdict === 'no'
          ? 'Not yet. ' +
            (first
              ? first.text + (nNo > 1 ? ' (' + nNo + ' planned assets are not possible)' : '') + '.'
              : 'The plan does not work yet.')
          : 'Tight. ' +
            (first
              ? (first.short || first.text).replace(/^Tight - /, '').replace(/^./, (c) => c.toUpperCase()) +
                '.'
              : 'It works, but with thin margins.');
    return {
      verdict,
      none: !nPl,
      headline,
      reasons,
      criteria: sortC(cs),
      assets,
      planned: planned.map((h) => h.id),
      unfunded: pl.unfunded.slice(),
      nNo,
      top: first,
    };
  }

  /* ---------- TODAY'S TERMS for the main page: the assets' own numbers at month 0 (2026*: today's dollars, no inflation, nothing grown). One function feeds the Planned and Real pages; ids = the assets to add up. ---------- */
  function todayTotals(S, pl, ids) {
    if (pl && pl.raw) pl = pl.raw;
    pl = pl || plan(S);
    const o = { n: 0, cf: 0, payment: 0, noi: 0, ds: 0, price: 0, rent: 0, dscr: null };
    (ids || S.houses.map((h) => h.id)).forEach((id) => {
      const v = pl.V[id],
        h = H(S, id);
      if (!v || !h) return;
      o.n++;
      o.cf += v.cf;
      o.payment += v.payment;
      o.noi += v.noi;
      o.ds += v.P + v.mip;
      o.price += +h.price || 0;
      o.rent += +h.rent || 0;
    });
    /* net worth NOW (this month, today's dollars): for the BOUGHT assets among ids, value - loan - liens - credit line drawn (engine month 0, the same terms as series.nw), plus the savings you hold today, plus the cash the trust holds today (o.trust). Planned assets are not owned yet, so they add nothing. */
    const ask = {};
    (ids || S.houses.map((h) => h.id)).forEach((id) => {
      const h = H(S, id);
      if (h && h.status === 'owned') ask[id] = 1;
    });
    o.eq = 0;
    if (pl.assetsAt)
      pl.assetsAt(0).forEach((x) => {
        if (ask[x.id]) o.eq += x.equity;
      });
    o.cash = S.p ? Math.max(0, +S.p.cash || 0) : 0;
    o.trust = Math.max(0, (pl.series && pl.series.cash && pl.series.cash[0]) || 0);
    o.nw = netWorth(o.eq, o.cash, o.trust); /* NET WORTH TODAY = bought assets (value - loan - liens - credit line) + your savings + the cash the trust holds today (the engine's month-0 trust cash, separate from your savings, so nothing is counted twice) */
    o.dscr =
      o.ds > 0.5
        ? o.noi / o.ds
        : null; /* DSCR = income before the loan / loan payment (principal + interest + mortgage insurance), the same ratio the asset page shows */
    return o;
  }

  /* ---------- THE CHECKS CARD: every check the app runs, in one list. The card on the main page is generated from this list, so it cannot drift: the portfolio tests of E.feasible, plus the two roll-ups (assets you can buy, cash beyond savings).
     Each item: { id (the row's test id), key, label, status: 'ok' | 'caution' | 'fail', value, limit, how, info (glossary key) }. fin = the finance result the page already has (or null without a personal profile). ---------- */
  const CHK_ORDER = [
    'p-funding',
    'p-cash',
    'p-runway',
    'p-hours',
    'p-dti',
    'p-cltv',
    'p-earners',
    'p-concentration',
  ];
  const CHK_ID = {
    'p-funding': 'check-pace',
    'p-cash': 'check-cushion',
    'p-runway': 'check-runway',
    'p-hours': 'check-hours',
    'p-dti': 'check-dti',
    'p-cltv': 'check-cltv',
    'p-earners': 'check-lasts',
    'p-concentration': 'check-concentration',
  };
  const CHK_INFO = {
    'p-funding': 'planpace',
    'p-cash': 'cushion',
    'p-runway': 'runway',
    'p-hours': 'hours',
    'p-dti': 'dti',
    'p-cltv': 'cltv',
    'p-earners': 'lasts',
    'p-concentration': 'concentration',
  };
  const CHK_LABEL = {
    'p-funding': 'Plan timing',
    'p-cash': 'Cash cushion',
    'p-runway': 'If the paycheck stops',
    'p-hours': 'Hours in a week',
    'p-dti': 'Debt-to-income peak',
    'p-cltv': 'Debt vs value',
    'p-earners': 'If big earners stop',
    'p-concentration': 'Concentration',
  }; /* short labels: a row label never wraps at 320px */
  function checkList(S, pl, fin) {
    const real = !!(pl && pl.raw),
      plIn =
        pl; /* plIn = the plan as the page shows it (today's dollars or future): money totals come from it */
    if (pl && pl.raw) pl = pl.raw;
    pl = pl || plan(S);
    if (fin === undefined) fin = S.p ? finance(S, pl) : null;
    const fe = feasible(S, pl, fin),
      out = [],
      planned = fe.planned.map((id) => fe.assets[id]),
      nPl = planned.length,
      noStart = nPl > 0 && pl.unfunded.length === nPl,
      anyOwned = S.houses.some((h) => h.status === 'owned'),
      kp = fin ? fin.kpis : null,
      g = S.g;
    CHK_ORDER.forEach((k) => {
      const c = fe.criteria.find((x) => x.id === k);
      if (!c) return;
      if (!nPl && /^p-(funding|cltv|concentration|earners)$/.test(k))
        return; /* plan-only tests: nothing is planned */
      if (k === 'p-dti' && noStart && !anyOwned)
        return; /* nothing can be funded: there is no debt peak to measure */
      let value = c.measured,
        how = c.how,
        limit = c.limit;
      if (k === 'p-funding' && !noStart && c.status !== 'fail' && isFinite(pl.lastBuy) && !pl.unfunded.length)
        value =
          'last ' +
          pl.lastBuy +
          ' mo'; /* short value (the date is in the line under it): the value never overflows a row at 320px */
      if (k === 'p-funding' && noStart) {
        value = 'cannot start';
        how =
          'None of the ' +
          nPl +
          ' planned asset' +
          (nPl === 1 ? '' : 's') +
          ' can be funded under the current numbers, so the plan cannot start. The first purchase needs your savings above the cushion plus your job money, and they do not reach it.';
      }
      if (k === 'p-cash' && kp) {
        const cash0 = +S.p.cash || 0,
          low = Math.min(kp.minLiquid, cash0),
          lowM = kp.minLiquid > cash0 ? 0 : kp.minLiquidMonth,
          rsvLow = fin.series.reserve[Math.min(fin.T, kp.minLiquidMonth)] || kp.reserveTarget0,
          short = Math.max(0, -kp.minLiquid); /* the lowest cash is never above the cash you have today */
        value = kp.minLiquid < 0 ? 'short ' + fm(short) : 'lowest ' + fm(low);
        how =
          kp.minLiquid < 0
            ? 'Your cash runs out ' +
              inM(kp.firstShortMonth) +
              ' and would be about ' +
              fm(short) +
              ' short at the lowest point, ' +
              mAt(kp.minLiquidMonth) +
              '.'
            : 'Lowest cash is ' +
              fm(low) +
              (lowM <= 0
                ? ' today' + (root.RepDate && root.RepDate.dt ? ' (' + root.RepDate.dt(0) + ')' : '')
                : ', ' + mAt(lowM)) +
              '; your cushion at that point is ' +
              fm(rsvLow) +
              (real ? " (both in today's dollars)" : ' (the cushion grows with inflation)') +
              '.';
        limit = 'above your ' + (S.p.emergencyMonths || 0) + '-month cushion';
      }
      if (k === 'p-dti')
        how =
          c.status === 'fail'
            ? 'Peaks at ' +
              pl.worst.dti.toFixed(0) +
              '% of qualifying income ' +
              inM(pl.worst.month) +
              ', over the ' +
              g.dti +
              '% limit: a lender may decline a loan then.'
            : 'Highest debt payments are ' +
              pl.worst.dti.toFixed(0) +
              '% of qualifying income, ' +
              inM(pl.worst.month) +
              '; lenders should approve every loan (limit ' +
              g.dti +
              '%).';
      out.push({
        id: CHK_ID[k],
        key: k,
        label: CHK_LABEL[k],
        status: c.status,
        value,
        limit,
        how,
        info: CHK_INFO[k],
      });
    });
    const notYes = planned.filter((x) => x.verdict !== 'yes'),
      top = notYes.slice().sort((a, b) => (b.verdict === 'no') - (a.verdict === 'no'))[0];
    if (nPl)
      out.push({
        id: 'check-buy',
        key: 'buy',
        label: 'Assets you can buy',
        status: notYes.some((x) => x.verdict === 'no') ? 'fail' : notYes.length ? 'caution' : 'ok',
        value: nPl ? nPl - notYes.length + ' of ' + nPl : 'none planned',
        limit: nPl ? 'all ' + nPl : 'none planned',
        how: top
          ? top.addr +
            ': ' +
            (top.top ? top.top.text : '') +
            (notYes.length > 1 ? ' (+' + (notYes.length - 1) + ' more)' : '')
          : 'every planned asset passes its own tests',
        info: 'buyscore',
      });
    const cash0 = S.p ? +S.p.cash || 0 : 0,
      hasCap = !!(S.p && S.p.capital.some((c) => c.amount > 0)),
      outT = plIn.outsideTotal;
    if (nPl && outT > 0)
      out.push({
        id: 'outside-cash',
        key: 'outside',
        label: hasCap ? 'Cash beyond the trust' : 'Paid from your own pocket',
        status:
          kp && kp.shortAmount > 0.5
            ? 'fail'
            : kp && (outT > cash0 || kp.reserveGap > 0.5)
              ? 'caution'
              : 'ok',
        value: fm(outT),
        limit: S.p ? 'your savings ' + fm(cash0) : 'none set',
        how: hasCap
          ? 'Needs this much cash beyond what the trust funds (partners, investors, savings).'
          : 'Your own cash for the down payments the trust cannot fund (the first purchase and anything beyond it)' +
            (S.p
              ? outT <= cash0
                ? '. Your ' + fm(cash0) + ' of savings covers it.'
                : '. That is more than your ' + fm(cash0) + ' of savings.'
              : '.'),
        info: 'outsidecash',
      });
    return out;
  }

  /* The shortfall panel for one planned asset: the cash lines, the monthly lines and what would have to change, every number from the live plan. opts.sim = also try the plan with the asset moved to the end of the buy order (one extra plan run). */
  function shortfall(S, pl, fin, id, opts) {
    if (pl && pl.raw) pl = pl.raw;
    pl = pl || plan(S);
    fin = fin || finance(S, pl);
    const h = H(S, id);
    if (!h || h.status === 'owned') return null;
    const F = fin && fin.feas ? fin.feas : feasible(S, pl, fin),
      A = F.assets[id];
    if (!A) return null;
    const c = A.cash,
      mo = A.monthly,
      v = pl.V[id],
      tr = pl.trust[id],
      g = S.g,
      type = h.type || 'house',
      ch = [];
    const cfNow =
        tr && tr.ok && tr.pooled ? Math.max(0, tr.cf || 0) / dfac(S, tr.month) : mo.poolCf + mo.personal,
      perMo = cfNow > 0.5 ? cfNow : 0;
    const fund = A.criteria.find((x) => x.id === 'funding'),
      dsc = A.criteria.find((x) => x.id === 'dscr'),
      car = A.criteria.find((x) => x.id === 'carry');
    const needAt = (price) => needFor(S, Object.assign({}, h, { price }));
    if (c.short > 0.5) {
      ch.push({
        id: 'cash',
        text:
          'Raise ' +
          fm(c.short) +
          ' more cash' +
          (perMo > 0
            ? ' (about ' + Math.ceil(c.short / perMo) + ' months at ' + fm(perMo) + '/mo of cash flow)'
            : ' (the portfolio has no spare monthly cash flow to build it)'),
        amount: c.short,
        months: perMo > 0 ? Math.ceil(c.short / perMo) : null,
      });
      const n1 = needAt(1e6),
        n0 = needAt(0),
        slope = (n1 - n0) / 1e6;
      if (slope > 0 && c.have > n0) {
        const P = Math.floor((c.have - n0) / slope);
        if (P > 0 && P < h.price)
          ch.push({
            id: 'price',
            text: 'Lower the price to ' + fm(P) + ' or less (now ' + fm(h.price) + ')',
            price: P,
          });
      }
      const fits = loansFor(type, h)
        .filter(
          (l) =>
            l.id !== h.loanId &&
            !l.ownerOcc &&
            !l.finRehab &&
            !l.info &&
            (type !== 'house' || !h.kind || h.kind !== 'multi' || mfFit(l, unitsOf(h), !!h.pack).ok),
        )
        .filter((l) => !FEAS.loanMax[l.id] || (h.price * (100 - l.dp)) / 100 <= FEAS.loanMax[l.id])
        .map((l) => ({
          id: l.id,
          name: l.name,
          need: (h.price * (l.dp + l.closing)) / 100 + (h.finCapex ? 0 : Math.max(0, h.capex || 0)),
          dp: l.dp,
        }))
        .sort((a, b) => a.need - b.need);
      const ok2 = fits.filter((l) => l.need <= c.have + 0.5);
      if (ok2.length)
        ch.push({
          id: 'loan',
          text:
            'Pick a loan that needs less down: ' +
            ok2
              .slice(0, 3)
              .map((l) => l.name + ' (' + fm(l.need) + ' to close)')
              .join('; '),
          loans: ok2.slice(0, 3),
        });
      else if (fits.length && fits[0].need < c.need - 0.5)
        ch.push({
          id: 'loan',
          text:
            'No loan in the app fits what you can pull out; the lowest is ' +
            fits[0].name +
            ', ' +
            fm(fits[0].need) +
            ' to close',
          loans: fits.slice(0, 1),
        });
    }
    if (!mo.covered) {
      const need2 = -mo.short;
      ch.push({
        id: 'cashflow',
        text: 'Add ' + fm(need2) + '/mo of cash flow to carry the payment',
        amount: need2,
      });
    }
    if (tr && tr.ok && fund.status !== 'ok' && fund.status !== 'fail')
      ch.push({ id: 'wait', text: 'Wait: the plan funds it ' + inM(tr.month), month: tr.month });
    if (dsc && dsc.status === 'fail') {
      const min = dscrMinOf(h),
        want = min * mo.payment - v.noi,
        k = type === 'business' ? 1 : (1 - g.vac / 100) * (1 - mgmtOf(S, h) / 100);
      if (want > 0)
        ch.push({
          id: 'rent',
          text:
            'Raise ' +
            (type === 'business' ? 'profit' : 'rent') +
            ' by ' +
            fm(want / k) +
            '/mo so the loan reaches DSCR ' +
            min,
          amount: want / k,
        });
    } else if (!mo.covered) {
      const k = type === 'business' ? 1 : (1 - g.vac / 100) * (1 - mgmtOf(S, h) / 100);
      ch.push({
        id: 'rent',
        text: 'Raise ' + (type === 'business' ? 'profit' : 'rent') + ' by ' + fm(-mo.short / k) + '/mo',
        amount: -mo.short / k,
      });
    }
    const after = S.houses
        .slice(S.houses.indexOf(h) + 1)
        .filter((q) => q.status !== 'owned' && pl.trust[q.id] && pl.trust[q.id].ok && pl.V[q.id].cf > 0),
      z = after.reduce((a, q) => a + pl.V[q.id].cf, 0);
    if (c.short > 0.5 && after.length && z > 0.5) {
      const o = {
        id: 'earlier',
        text:
          'Buy the ' +
          after.length +
          ' assets after it first (they add ' +
          fm(z) +
          '/mo of cash flow) by moving it down the buy order',
        amount: z,
        n: after.length,
      };
      if (opts && opts.sim) {
        const S2 = JSON.parse(JSON.stringify(S)),
          ids = S2.houses
            .filter((q) => q.status !== 'owned')
            .map((q) => q.id)
            .filter((q) => q !== id)
            .concat([id]);
        reorder(S2, ids);
        const p2 = plan(S2),
          m2 = p2.purchase[id];
        o.simMonth = isFinite(m2) ? m2 : null;
        o.text += isFinite(m2) ? ': then it is bought ' + inM(m2) : ': it still cannot be funded in the plan';
      }
      ch.push(o);
    }
    return {
      id,
      verdict: A.verdict,
      cash: c,
      monthly: mo,
      changes: ch,
      lines: {
        cashNeeded: {
          label: 'Cash needed to close',
          value: c.need,
          how:
            'down ' +
            fm(c.down) +
            ' + closing ' +
            fm(c.closing) +
            (c.rehab > 0 ? ' + cash rehab ' + fm(c.rehab) : '') +
            ' = ' +
            fm(c.need),
        },
        savings: {
          label: 'Your savings above the cushion',
          value: c.savings,
          how: c.pooled
            ? 'savings fund only the first purchase; later ones come from the trust'
            : 'cash on hand above the ' +
              ((S.p && S.p.emergencyMonths) || 0) +
              '-month reserve, plus job money saved by then',
        },
        trustCash: {
          label: 'Cash the trust holds',
          value: c.trustCash,
          how:
            'cash held by the assets above it' +
            (c.closest ? ' at the closest month, ' + mAt(c.month) : c.pooled ? ' ' + inM(c.month) : ''),
        },
        room: {
          label: 'Borrowing room',
          value: c.room,
          how:
            g.cap +
            "% of the assets' value (a business " +
            g.capBiz +
            '%) less their loans and what is already drawn',
        },
        pull: {
          label: 'Cash you can pull out then',
          value: c.have,
          how: fm(c.savings) + ' + ' + fm(c.trustCash) + ' + ' + fm(c.room) + ' = ' + fm(c.have),
        },
        downShort:
          c.short > 0.5
            ? {
                label: 'Down payment short',
                value: -c.short,
                how: fm(c.have) + ' can pull out - ' + fm(c.need) + ' needed = ' + sgn(c.have - c.need),
              }
            : {
                label: 'Down payment covered',
                value: c.have - c.need,
                how: fm(c.have) + ' can pull out - ' + fm(c.need) + ' needed = ' + fm(c.have - c.need) + ' to spare',
                suf: ' to spare',
              },
        uncovered: {
          label: 'Money still uncovered',
          value: c.uncovered > 0 ? -c.uncovered : 0,
          how: fm(c.have) + ' can pull out - ' + fm(c.need) + ' cash to close = ' + sgn(c.have - c.need),
        },
        payment: {
          label: 'New loan payment',
          value: mo.payment,
          how:
            'principal + interest' +
            (mipMonthly(h) > 0 ? ' + mortgage insurance ' + fm(mipMonthly(h)) : '') +
            ' on ' +
            fm(loan(h)) +
            ' at ' +
            h.rate +
            '%' +
            (type !== 'business' && (h.tax || h.ins || h.hoa) ? ' (property costs are not in this figure)' : ''),
        },
        available: {
          label: 'Cash flow available to carry it',
          value: mo.available,
          how:
            'asset income ' +
            fm(mo.asset) +
            ' + pool ' +
            fm(mo.poolCf) +
            (mo.personal > 0 ? ' + your surplus ' + fm(mo.personal) : '') +
            " per month, today's dollars",
        },
        monthShort: {
