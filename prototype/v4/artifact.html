    trustmath: { t: 'How the pool is worked out', b: 'Borrowing room = for every asset before it, its value times the borrowing cap, less the appraisal cut, its loan and other liens. Cash = reinvested cash flow and sale proceeds. Room plus cash must cover the cash needed. The part not covered by cash is drawn on the line of credit at its rate. The four rules below apply to every asset.', e: 'A $100,000 home, cap 85%, cut 0%, loan $60,000: room $25,000. With $2,000 cash the pool is $27,000.' },
    nextdp: { t: 'Funded by the trust', b: 'The month, counted from today, when the trust can pay for an asset. Everything above it in the list forms one pool. The pool pays when its borrowing room plus its cash reaches the cash the asset needs. Room counts as funding: the rest is drawn on the line of credit. An asset is never funded before the ones above it.', e: 'A pool with $126,000 of room and no cash can fund a $123,500 need.' },
    autopay: { t: 'Profit and job money to loans', b: 'While a planned asset is waiting, pooled cash flow pays the line of credit and builds cash for it. After that, each asset’s profit pays down its own loan. Your job pay left after living costs and your cash cushion is split equally across the loans. Loans end sooner. Turn it off to keep that money as cash.', e: 'An asset that earns $1,000 a month after its loan payment sends it to its own loan.' },
    cashneeded: { t: 'Cash needed', b: 'The down payment, closing costs and any improvements paid in cash for the asset the trust is about to buy.' },
    dti: { t: 'Debt-to-income (DTI)', b: "Your monthly debt payments divided by your monthly income. Counts your other debts, your own housing and the plan's loans, and only part of rent as income." },
    qualifying: { t: 'Qualifying income', b: 'The income a lender counts to approve a loan: your jobs, a co-signer’s income, and part of rental income.' },
    cosigner: { t: 'Co-signer', b: 'A person, like a parent, who promises to repay the loan if you cannot. Lenders count their income and credit too, which can help you qualify.' },
    rentcount: { t: 'Rent counted', b: 'Lenders count only part of rent as income, often 75%, to allow for empty months and costs.' },
    haircut: { t: 'Appraisal cut', b: 'Lenders sometimes lend against a bit less than the appraised value. A 5% haircut means they count only 95% of it.' },
    vacancy: { t: 'Vacancy', b: "The share of the year a rental sits empty. The default is 7%, about the U.S. rental vacancy rate." },
    mgmt: { t: 'Management fee', b: 'What a property manager charges, as a percent of the rent collected (often 8% to 10% for homes). Every home, building and commercial property starts at the Assumptions rate and you can set it for one asset. Enter it even if you plan to manage it yourself, to stay safe.', e: '8% of $2,000 of rent is $160 a month.' },
    repairs: { t: 'Repairs reserve', b: "Money set aside each year for repairs. A yearly percent of the asset's value, not of rent." },
    ownerocc: { t: 'Owner-occupied', b: 'You must live in the home yourself, usually for at least a year. FHA and 203(k) loans require it, so they do not work for a pure rental.' },
    fha: { t: 'FHA loan', b: 'A government-backed loan with a small down payment (3.5%) and mortgage insurance. For a home you will live in.' },
    k203: { t: 'FHA 203(k) loan', b: 'One loan that covers the purchase and the repairs. You put down 3.5% of the price plus repairs, and the repair money is paid out as the work is done. The Limited version covers repairs up to $75,000. Bigger jobs need a Standard 203(k) with a consultant approved by the U.S. housing agency (HUD). You must live in the home.' },
    mip: { t: 'Mortgage insurance (MIP)', b: "Mortgage insurance (MIP) is a fee on a Federal Housing Administration loan that protects the lender. The app uses 1.75% of the loan up front, added to the loan, and 0.55% a year, paid monthly." },
    interestonly: { t: 'Interest-only', b: 'You pay only the interest each month, so the balance does not go down. Extra payments still reduce it. When the loan comes due, the balance left is refinanced into a normal loan at the refinance rate and term, so the payment goes up after that month.' },
    bridge: { t: 'Bridge loan', b: 'A short, higher-rate loan that covers the gap until you refinance or sell. Usually interest-only. When it comes due the balance is refinanced at the refinance rate and term set in Assumptions.' },
    sba: { t: 'SBA loan', b: 'A bank loan partly guaranteed by the U.S. Small Business Administration. The 7(a) loan is common for buying a business (up to $5 million). The 504 loan is for real estate and big equipment (up to $5.5 million) and usually needs you to operate in the building.' },
    sellerfin: { t: 'Seller financing', b: "The seller lends you part of the price instead of a bank. Sellers rarely carry 80% or more, so treat this app's seller note presets as aggressive." },
    conv: { t: 'Conventional loan', b: 'A standard mortgage that is not government-backed. For investment homes it usually needs 15% to 25% down.' },
    cashbuy: { t: 'Cash purchase', b: 'You pay the full price yourself with no loan. No monthly loan payment, but it uses a lot of cash.' },
    bankloan: { t: 'Bank loan', b: 'A regular loan from a bank, with a set rate and term. Banks usually want a strong income cushion (a DSCR of 1.25 or more) and 25% or more down.' },
    buyin: { t: 'Not before (months)', b: "The earliest month the app may buy this asset. The earliest month to buy. The trust still waits until the pool can pay; 0 means no limit." },
    paid: { t: 'Months already paid', b: 'How many monthly payments you have already made on a loan you own now. It sets today’s balance.' },
    networth: { t: 'Net worth', b: 'The big number is what you are worth today: bought assets at estimated market value (before selling costs and taxes) minus loans, liens and credit lines drawn, plus your savings, plus the cash the trust holds today. Planned assets add nothing until bought. The small line is the plan-end figure (year 28, future dollars): assets and trust cash only, without your savings.', e: 'A $300,000 home with a $200,000 loan, $50,000 savings and $10,000 trust cash: net worth today is $160,000.' },
    equity: { t: 'Equity', b: 'What an asset is worth minus what you owe on it. It is the part you really own.' },
    cashflow: { t: 'Cash flow', b: 'The money left each month after the loan payment and costs. Positive means the asset pays for itself. For a whole portfolio it is the net profit per month: the cash gained by all the assets in the trust.' },
    impact: { t: 'Impact on your plan', b: 'Each line starts with the portfolio without this asset, adds this asset on its own, then the knock-on changes to the other assets (they can be bought earlier or later), and ends with the portfolio with it. Cash flow and payments are per month in today\'s terms, like the main page.', e: '$1,000 + $300 + $20 = $1,320 a month.' },
    boughton: { t: 'Bought on', b: "The day you bought this asset. A record only. No number in the app depends on this date." },
    outsidecash: { t: 'Paid from your own pocket', b: "Money for purchases that comes from your own pocket, not from the portfolio. Not a warning. Amber when it exceeds all your savings, red if your cash would run short.", e: 'The first purchase needs $38,800 of your own cash and you hold $45,000 in savings: plain.' },
    cashfromselling: { t: 'Trust cash', b: "Cash the trust holds after a sale and from pooled cash flow not yet spent. Trust cash pays for later purchases first, before your savings or outside money." },
    projection: { t: 'Years until your target', b: 'How many years ahead the plan looks. Portfolio totals show where you stand at the end. A longer period means more inflation, so the same dollars buy less: figures are shown in today\'s dollars by default (see Show figures in), with the future-dollar amount beside them.' },
    emergency: { t: 'Emergency reserve', b: 'Cash you want to keep in case your income stops or a repair hits, counted as months of living costs plus debts. Many people aim for 3 to 6 months.' },
    liquid: { t: 'Savings you have now', b: 'Money you can use right away, like savings and checking. Not retirement accounts or the value of a home.' },
    cashapy: { t: 'Cash interest', b: 'The yearly percent your savings earn. High-yield savings accounts pay a few percent. Enter 0 if unsure.' },
    living: { t: 'Living costs', b: 'What you spend each month on your own life: rent, food, car, phone, insurance, fun.' },
    inflation: { t: 'Cost increases per year', b: 'How much your living costs go up each year. 3% is a common planning number. It is also the rate used to convert future dollars to today\'s dollars (see Show figures in).' },
    otherdebts: { t: 'Other monthly debts', b: 'Payments like a car loan, student loans or credit cards. Lenders count them when approving loans.' },
    portfoliotax: { t: 'Tax on portfolio income', b: "The tax rate on your portfolio profit. Left blank, the app estimates federal, state and 3.8% tax on profit after interest and depreciation." },
    salestax: { t: 'Tax on gains when you sell', b: "The tax rate on the gain when you sell an asset. Left blank, the app works it out, including tax on the depreciation you took. Type a rate to override." },
    operating: { t: 'Businesses you run yourself', b: "How many businesses you run yourself. Businesses beyond this number each get a paid manager, set under Manager pay." },
    bizhours: { t: 'Hours each business takes', b: 'How many hours a week one business needs from you when you run it yourself.' },
    gmpay: { t: 'Manager pay', b: 'What you would pay a general manager to run a business for you, per month. Business profit figures usually assume the owner does the work.' },
    planned: { t: 'Planned expenses', b: "One-time expenses you expect, like a wedding or a car. Taken from your cash in the month you pick." },
    capital: { t: 'Outside capital', b: "Money that partners, investors or family put in. Added to your cash in the month you pick." },
    wage: { t: 'Hourly wage', b: "What you earn per hour. Before tax. The app multiplies it by your hours and weeks. Enter tips separately." },
    tips: { t: 'Tips per hour', b: 'Extra money per hour worked that customers give you, like at a restaurant. Enter an average. Tips count as income and are taxed. Leave 0 if the job has no tips.' },
    weeks: { t: 'Weeks per year', b: 'How many weeks a year you actually work. 50 allows for two weeks off.' },
    taxrate: { t: 'Tax rate', b: "The share of your pay that goes to tax. Leave blank for a rough U.S. estimate with no state tax. Type a number to use your own." },
    raise: { t: 'Yearly raise', b: 'How much your pay goes up each year, as a percent. Leave 0 if you do not expect one.' },
    jobend: { t: 'How long you will do this job', b: "The month this job stops paying you. Months from today. Leave blank if the job has no end date." },
    jobstart: { t: 'When the job starts', b: "The month this job starts paying you. Months from today. 0 means you already have the job." },
    checks: { t: 'Checks and safe ranges', b: "Tests that compare your plan with safe limits. Plain is safe, amber is past the caution line, red is over the limit everywhere, including Can I afford this." },
    runway: { t: 'If the paycheck stops', b: "How long your cash lasts if the paycheck stops. Months your cash lasts with no job pay, counting portfolio income. Amber under 3, red under 1.", e: '$60,000 of cash and $10,000 a month of costs lasts 6 months.' },
    hours: { t: 'Hours in a week', b: "Your weekly hours across your job and any business you run. Your job plus businesses you run, at the plan's busiest month. Amber above 70 hours.", e: 'A 50-hour job plus two businesses at 10 hours each is 70 hours.' },
    cltv: { t: 'Debt vs value', b: "Combined loan to value is all your debt as a share of what your assets are worth. Measured at the month the last asset is bought, against the debt cap in Assumptions.", e: '$63 of debt on every $100 of value is 63%, under an 85% cap.' },
    concentration: { t: 'Concentration', b: "How much of your portfolio sits in one asset. Price share of the biggest asset. Amber above 35%, red above 60%, once there are at least 3 assets.", e: 'A $2M business in a $5M portfolio is 40%.' },
    cushion: { t: 'Cash cushion', b: "The cash you want to keep as a safety reserve. Shows the lowest your cash gets over the plan against the cushion at that month." },
    lasts: { t: 'If big earners stop', b: "A stress test of what happens if your biggest earners stop paying. Assumes the biggest earners, about 45% of a group's assets, stop paying. Months your cash and trust cash cover bills.", e: 'Cash of $300,000 and a $50,000 monthly shortfall lasts 6 months.' },
    buyscore: { t: 'Can I buy this?', b: "The answer to whether you can afford this purchase. If a cash or lender test fails, the answer is Not possible. Near a limit, it is Tight.", e: 'A $10M business needs $2.5M down. If the plan can pull out only $1M, the cash test fails and you are $1.5M short.' },
    buypos: { t: 'Buy position', b: 'Where this asset sits in the buy order, counted across homes, commercial properties and businesses together: 1 is bought first. Type a number and the asset moves there, even past other types; the others shift and every number is worked out again. An asset is never bought before the ones above it.', e: 'With 5 planned, type 1 on the third asset and it is bought first; the old first and second become second and third.' },
    planpace: { t: 'Last purchase', b: "How late your last purchase happens in the plan. A Plan timing check appears only when the last purchase is late or an asset is never funded." },
    cashin: { t: 'Cash you put in', b: 'The cash you paid to get the asset: the down payment, the closing costs, and improvements paid in cash (not financed in the loan).' },
    cashprofit: { t: 'Cash profit', b: "What you keep in cash when you sell. After selling costs, the loan and liens, tax on the sale, and the cash you put in.", e: 'Sold for $180,000; $11,000 selling costs, $90,000 loan, $7,000 tax; you put in $60,000: cash profit $12,000.' },
    revenue: { t: 'Total revenue', b: "All the money a business takes in before its costs. Type per month or per year, like 100k/month or $1.2M per year. No period means per month.", e: '1,200,000/yr becomes 100,000 a month.' },
    margin: { t: 'Profit margin', b: 'The share of revenue you keep as owner profit after the business pays its own costs (staff, supplies, rent). Typical small businesses keep 10% to 25%. Owner profit = revenue x margin.', e: '$90,000 a month of revenue at 20% is $18,000 a month of owner profit.' },
    ownerprofit: { t: 'Owner profit', b: 'What the business pays you each month before any loan payment: total revenue times the profit margin. It is calculated, so change the revenue or the margin to change it.', e: '$90,000 revenue x 20% = $18,000 a month ($216,000 a year).' },
    calc: { t: 'Math in a number box', b: "You can type a sum into any number box. Type math like 650*3 or (2000-300)/2. Incomplete math keeps the last good number and shows Check the math.", e: 'Rent of $650 for each of 3 people: type 650*3 and it becomes 1,950.' },
    grosspay: { t: 'Gross pay', b: 'Your pay for the year before any taxes are taken out.' },
    hometype: { t: "Single or multi-family", b: "Single family is one home with one rent. Multi-family means two or more units under one price, such as a duplex, an apartment building or a pack of houses. You enter the number of units. Loans, costs and checks change with the size.", e: "2 to 4 units are financed like homes. 5 or more units are financed on the income of the building." },
    unitcount: { t: "Number of units", b: "How many homes or apartments the building has. From 2 to 500. Rent, tax and insurance start at typical amounts for that size.", e: "A fourplex is 4 units. A Section 8 pack of 5 houses is 5 units." },
    mfpack: { t: "Building or pack of houses", b: "A pack is several separate houses, financed with a blanket loan or separate investor loans, not as a building.", e: "Five houses on five streets are a pack. A 12-unit building is a building." },
    rentunit: { t: "Rent per unit", b: "The monthly rent for one unit. You can type the total instead, and rent per unit follows.", e: "20 units at $1,100 each is $22,000 a month." },
    mfreserve: { t: "Replacement reserve", b: "Money set aside each year for every unit, to replace big items later: roofs, heating and air, floors and parking lots. Lenders usually ask for about $250 to $350 per unit a year. Many owners keep $300 or more. It lowers cash flow now so a big repair does not.", e: "50 units at $300 a year is $15,000 a year, or $1,250 a month." },
    mfother: { t: "Other owner-paid costs", b: "Monthly costs you pay as the owner that are not listed elsewhere: water, sewer and trash for shared areas, lawn and snow, ads for empty units, legal and accounting, and pay for an on-site manager or maintenance helper. Buildings of 20 or more units often need payroll.", e: "A part-time maintenance helper plus shared utilities can run $60 per unit a month." },
    oer: { t: "Operating expense ratio", b: "Your yearly costs before the loan, divided by the rent you actually collect after vacancy. Well run buildings usually land between 35% and 55%. Under 35% may mean some costs are left out. Over 55% means the building is costly to run.", e: "$20,000 of costs on $50,000 of collected rent is 40%." },
    mfchecklist: { t: "Purchase checklist", b: "Ask the seller for the rent roll and leases, 12 months of income and costs, 2 to 3 years of tax returns, utility bills, tenant estoppel letters, the tax bill, insurance quotes and claims history. Then order a condition report, roof and system checks, an environmental report, title and survey. Inspect a sample of units. Confirm the zoning allows this many units." },
    mflenders: { t: "What lenders look at", b: "For 5 or more units a lender looks at the building, not your pay. They check DSCR, LTV, how full the building is, the rent roll and the costs. They want about 90% occupancy and a DSCR near 1.25. For 2 to 4 units they also check your credit and the cash you have left after closing." },
    mfcosts: { t: "Ongoing costs and reserves", b: "Plan for tax, insurance, repairs, management, vacancy, shared utilities, payroll and a reserve for big items. Tax can jump after a sale when the county values the building again. Insurance climbs with age and size. Older buildings often use 45% to 55% of income for costs." },
    mfstaff: { t: "Staff and management by size", b: "Packs and small buildings usually use a property manager at 8% to 10% of rent. From 20 units, add a maintenance helper. From 50 units, many owners hire an on-site manager and a maintenance tech, and pay the management company less, about 5% to 6%." },
    mfsec8: { t: "Section 8 packs (HQS / NSPIRE)", b: "Section 8 pays part of the rent for voucher renters. The rent is capped by the Fair Market Rent (FMR) for the area and the bedroom count. The housing authority inspects each house before move-in and every year. Its share is paid straight to you and can be late. Leases renew each year.", e: "A 3-bedroom FMR of $2,182 caps that unit near that rent." },
    ltv: { t: "Loan to value (LTV)", b: "The loan as a share of the price or value. A 75% LTV loan on a $1,000,000 building is $750,000, and you put down $250,000. Lenders use a lower LTV for riskier loans.", e: "80% LTV means 20% down." },
    mfcreative: { t: "Creative financing risks", b: "Seller notes, master leases, subject-to deals and partners can lower the cash you need. They also add risk: the seller lender may call the loan, you owe rent on empty units, and partners need written terms. Use a real estate lawyer. The app shows each one as the closest normal loan." },
    mfFha: { t: "FHA 2-4 unit loan (house hack)", b: "Typical, not a quote. For 2 to 4 units you live in. Down payment 3.5%, so LTV up to 96.5%. Units 3 and 4 must pass a test that rent covers the payment (DSCR 1.0). Rate about 6.5% to 7.2% plus mortgage insurance. Full personal guarantee, no prepayment fee. Closes in 30 to 45 days. Use it to start with little cash.", e: "Live in one unit of a fourplex and rent three." },
    mfVa: { t: "VA loan for 2-4 units", b: "Typical, not a quote. For eligible veterans who live in one of 2 to 4 units. No down payment, so LTV up to 100%. Rate about 6.2% to 7.0%. A one-time funding fee of about 2.15% is added to the loan. Full personal guarantee, no prepayment fee. Closes in 30 to 45 days. Use it for a house hack with no cash down." },
    mfConvOO: { t: "Conventional 2-4 units (live in)", b: "Typical, not a quote. For 2 to 4 units you live in. Down payment about 5% for 2 units and 10% to 25% for 3 or 4, so LTV 75% to 95%. Rate about 6.6% to 7.4%. Credit score 680 or more helps. Full personal guarantee, no prepayment fee. Closes in 30 to 45 days. Use it if you have good credit and want no FHA insurance." },
    mfK203: { t: "FHA 203(k) for 2-4 units", b: "Typical, not a quote. Buy and renovate a 2 to 4 unit home you live in, with one loan. Down payment 3.5% of price plus rehab, so LTV up to 96.5%. Rate about 6.9% to 7.6% plus mortgage insurance. Full personal guarantee, no prepayment fee. Closes in 45 to 60 days. Use it for a run-down duplex." },
    mfConvInv: { t: "Conventional 2-4 units (investor)", b: "Typical, not a quote. For 2 to 4 units you rent out. Down payment 15% to 25%, so LTV 75% to 85%. Rate about 7.0% to 8.0%. Lenders check your income, and DSCR should be about 1.0 or more. Full personal guarantee, no prepayment fee. Closes in 30 to 45 days. Use it for a steady rental when you have income to show." },
    mfBlanket: { t: "Blanket loan (pack of houses)", b: "Typical, not a quote. One loan covers every house in the pack. Up to about 75% LTV, DSCR 1.0 to 1.25 on the whole pack, rate about 7.3% to 8.5%. Loans start near $500,000. Often a personal guarantee, and prepayment fees are common. Closes in 30 to 45 days. Ask for release clauses so you can sell one house." },
    mfDscr: { t: "DSCR loan (1-4 units or pack)", b: "Typical, not a quote. Approved on the rent against the payment, not your pay. DSCR 1.0 to 1.25, LTV 75% to 80%, rate about 7.0% to 8.5%. Often a personal guarantee, and prepayment fees are common. Closes in 21 to 40 days. Many lenders take Section 8 rent. Use it when your tax returns show little income." },
    mfSbl: { t: "Agency small-balance loan", b: "Typical, not a quote. Fannie Mae and Freddie Mac loans for 5 to 50 units, about $750,000 to $7.5 million. LTV up to 75% to 80%, DSCR 1.20 to 1.40, rate about 5.5% to 7.5%. Usually no personal guarantee (non-recourse). Prepayment fees step down. Closes in 45 to 75 days. Use it for a stable building." },
    mfAgency: { t: "Agency loan (5+ units)", b: "Typical, not a quote. Fannie Mae and Freddie Mac loans for stable buildings of 5 or more units. LTV up to 80%, DSCR about 1.25, 90% or more full, rate about 5.5% to 7.5%. Terms of 5 to 30 years. Usually no personal guarantee (non-recourse). Prepayment fees apply. Closes in 45 to 90 days. Use it for the lowest rate." },
    mfHud: { t: "HUD 223(f) loan, 35 years", b: "Typical, not a quote. A HUD and FHA loan to buy or refinance a building of 5 or more units, best near 20 or more. LTV up to 85%, DSCR about 1.18 to 1.20, fixed rate near 5.5% to 6.5%, 35 years. No personal guarantee (non-recourse) and the loan can be taken over. Prepayment fees apply. Takes 6 to 9 months." },
    mfBank5: { t: "Bank loan, 5-year balloon", b: "Typical, not a quote. A bank or credit-union loan on a 25-year schedule, due in 5 years. LTV 65% to 80%, DSCR 1.25 to 1.30, rate about 6.5% to 8.0%. Often a full personal guarantee. Prepayment fees are common. Closes in 30 to 45 days. Use it for a quick, flexible deal. You refinance when it comes due." },
    mfBank10: { t: "Bank loan, 10-year fixed", b: "Typical, not a quote. A bank or credit-union loan with a rate fixed for 10 years on a 25-year schedule, then due. LTV 65% to 80%, DSCR 1.25 to 1.30, rate about 6.75% to 8.0%. Often a full personal guarantee. Prepayment fees are common. Closes in 30 to 60 days. Use it for a longer, steadier loan." },
    mfCmbs: { t: "CMBS conduit loan", b: "Typical, not a quote. A loan that is pooled and sold to investors, usually $2 million or more. LTV 65% to 75%, DSCR about 1.25, 10-year term on a 30-year schedule, rate about 6.0% to 7.5%. No personal guarantee (non-recourse). Paying off early costs a lot. Closes in 45 to 75 days. Use it for a large, stable building." },
    mfSba504: { t: "SBA 504 loan (mixed-use)", b: "Typical, not a quote. Only if your business uses at least 51% of the building, such as a shop below apartments. Down payment about 10%, so LTV up to 90%. DSCR about 1.15. Fixed rate near 6.5% to 7.0% for 25 years. Full personal guarantee. Prepayment fees in the first 10 years. Takes 60 to 90 days. Not for pure rentals." },
    mfBridge: { t: "Bridge loan (interest-only)", b: "Typical, not a quote. A short loan of 1 to 3 years to buy, fix up and fill a building. You pay interest only. Up to 65% to 80% of cost, rate about 7.5% to 12.75% plus 1 to 3 points. Often a personal guarantee. Fast: 10 to 30 days. Use it, then refinance into an agency or HUD loan. If you cannot refinance, you could lose the building." },
    mfSeller: { t: "Seller note with balloon", b: "Typical, not a quote. The seller carries part of the price. Down payment 10% to 30%, rate about 5% to 7.5%, paid on a 20 to 30 year schedule and due in 3 to 10 years. No lender rules, so DSCR and LTV are what you both agree. Recourse and prepayment are set in the note. Closes in 2 to 4 weeks. Use it when banks say no." },
    mfSellerIO: { t: "Seller financing, interest-only", b: "Typical, not a quote. The seller carries the loan and you pay interest only, about 5 years. Down payment 10% to 30%, rate about 5% to 7%. No lender rules, so DSCR and LTV are what you both agree. Recourse and prepayment are set in the note. Closes in 2 to 4 weeks. Use it to keep payments low while you improve the building." },
    mfAssume: { t: "Assumable loan", b: "You take over the seller's existing loan. The app assumes you pay the gap between price and loan balance in cash, about 35%." },
    mfLease: { t: "Master lease with option (info)", b: "You control the building with an option to buy it, and you rent out the units. The app models this as a 5 year interest only seller loan with a 3% option fee." },
    mfSubTo: { t: "Subject-to deal (info)", b: "You buy the building and the seller's loan stays in place. The app models this as taking over the seller loan and paying the gap in cash." },
    mfJv: { t: "Equity partner or joint venture (info)", b: "Partners put in the down payment and you run the building for fees and a share of profit. The app models a 75% bank loan. Add partner money under Finances, Outside capital." },
    safety: { t: 'Safety copies', b: "Automatic backup copies of your portfolio on this device. Taken before anything that could replace your portfolio, and once a day. Not part of a backup." },
    bugreport: { t: 'Report a problem', b: 'Copy the report and paste it into your Claude chat so the problem can be reproduced and fixed. The app sends nothing by itself. It lists the app version, the checks that failed, recent events and errors, and your last ten taps (button names only, never what you typed). With Include my numbers off it has only counts and codes. Turn it on to add net worth, cash flow and each asset\'s price and rent. Addresses are never included.' },
  };
  const LABEL = {
    'Other liens': 'liens', 'Down payment': 'downpayment', 'Down payment $': 'downamt', 'Loan amount': 'loanamount', 'Interest rate': 'rate', 'Term (years)': 'term', 'Closing costs': 'closing', 'Extra / month': 'extra',

  /* Can the plan buy this planned asset? One test list (E.feasible): funding from the pool on the one clock (months from today), the lender tests, reserves, income fit, deal quality, stress tests and concentration.

  const FEM = new WeakMap();
  function feasFor(pl) {

        return o;
      }; /* value and equity are at the plan end (2026* dollars); cash flow is today's (2026*) */
    const bRow = (label, o, cls) =>
      `<tr class="${cls || ''}"><td>${label}</td><td>${$c(o.value)}</td><td>${$c(o.equity)}</td><td class="${o.cf < 0 ? 'bad' : ''}">${$cs(o.cf)}</td></tr>`;
    const breakdown = `<table class="cmp" data-testid="breakdown"><thead><tr><th></th><th>Value</th><th><span class="nw">Equity${infoBtn('equity')}</span></th><th><span class="nw">Cash flow/mo</span></th></tr></thead><tbody>
      ${['house', 'commercial', 'business']
        .map((tp) => {
          const o = bt(tp);
          return o.n ? bRow(TPL[tp] + ' (' + o.n + ')', o) : '';
        })
        .join('')}
      ${Math.abs(sn.sav || 0) > 0.5 ? bRow('Your savings', { value: sn.sav, equity: sn.sav, cf: 0 }) : ''}
      ${sn.cash > 0.5 ? bRow('Trust cash', { value: sn.cash, equity: sn.cash, cf: 0 }) : ''}
      ${bRow('Portfolio', { value: restSn.reduce((a, x) => a + x.value, 0), equity: sn.nw, cf: td.cf }, 'tot')}</tbody></table>`;
    /* Checks: one plain row per number; a row is highlighted only when its number passes a safe amount (see SAFE). One root cause is one row: debt-to-income covers the lenders too. */
    const kp = fin ? fin.kpis : null,
      hasCap = !!(S.p && S.p.capital.some((c) => c.amount > 0));
    const dtiOver = pl.worst.dti > g.dti,
      affS = fin
        ? dtiOver && fin.status === 'tight'
          ? 'no'
          : fin.status
        : null; /* lenders who would decline mean "not yet" everywhere: chip, Checks and rows agree */
    const chkRows = [],
      nPlan0 = S.houses.filter((h) => h.status !== 'owned').length,
      noStart = nPlan0 > 0 && pl.unfunded.length === nPlan0,
      anyOwned = S.houses.some(
        (h) => h.status === 'owned',
      ); /* noStart: not one planned asset can be funded, so there is no plan to measure (no purchase month, no loan, no peak) */
    /* every check the app runs, from the engine's one list (E.checkList): value, limit, status, (i). The card cannot drift from the tests because it is generated from them. */
    const LVMAP = { ok: 'ok', caution: 'warn', fail: 'bad' },
      STW = { ok: 'Safe', caution: 'Watch', fail: 'Over the limit' };
    const checkItems = E.checkList(S, pl, fin);
    checkItems.forEach((c) =>
      chkRows.push({
        id: c.id,
        lvl: LVMAP[c.status],
        label: esc(c.label),
        val: esc(c.value),
        info: c.info,
        sub: `<b class="cst" data-testid="${c.id}-status">${STW[c.status]}</b>${c.limit ? ' · limit: <span data-testid="' + c.id + '-limit">' + esc(c.limit) + '</span>' : ''} · ${esc(c.how)}`,
      }),
    );
    const chkWorst = Math.max(0, ...chkRows.map((x) => LV[x.lvl])),
      chkAll = chkWorst === 0,
      chkCollapsed = UI.coll.checks === undefined ? chkAll : UI.coll.checks,
      chkOpen = !chkCollapsed;
    CDEF.checks =
      chkAll; /* all safe: the rows stay folded behind Details; something to look at: they start open. The Details button is there in both states and never moves. */
    const nFlag = chkRows.filter((x) => x.lvl !== 'ok').length;
    const chkList = chkRows
      .map(
        (x) =>
          `<div class="chk lv-${x.lvl}" data-testid="${x.id}" data-lvl="${x.lvl}"><div class="ct"><b>${x.label}</b>${infoBtn(x.info)}<span class="cv lv-${x.lvl}">${x.val}</span></div><small>${x.sub}</small></div>`,
      )
      .join('');
    const checks = `<section class="card checks ${chkAll ? 'safe' : chkWorst === 2 ? 'over' : 'caution'}" data-testid="checks" data-n="${chkRows.length}"><div class="chkh"><h2 class="chkt">Health${infoBtn('checks')}</h2><button type="button" class="chip link chkbtn" data-coll="checks" aria-expanded="${chkOpen}" data-testid="checks-details">Details ${chkOpen ? '▾' : '▸'}</button></div>${chkAll ? `<p class="chkok" data-testid="checks-ok">✓ All ${chkRows.length} checks are in the safe range</p>` : `<p class="chkflag ${chkWorst === 2 ? 'bad' : 'warn'}" data-testid="checks-flag">${nFlag} of ${chkRows.length} to look at</p>`}${chkOpen ? `<div class="chklist" data-testid="checks-list">${chkList}</div>` : ''}${fin ? '<button type="button" class="linkbtn leftbtn" data-go="finances" data-testid="checks-finances">Open Finances ›</button>' : ''}</section>`;
    const badHomes = S.houses.filter((h) => (h.type || 'house') === 'house' && pl.V[h.id].cf < 0);
    const homeWarn = badHomes.length
      ? `<div class="warnbox" data-testid="home-warning">⚠ Homes must cash flow positive. Losing money each month at today's terms: ${badHomes.map((h) => esc(h.addr)).join(', ')}.</div>`
      : '';
    const tab = UI.tab,
      nb = S.houses
        .filter((h) => h.status === 'planned' && isFinite(pl.purchase[h.id]))
        .sort((a, b) => pl.purchase[a.id] - pl.purchase[b.id])[0];
    const nPl = S.houses.filter((h) => h.status !== 'owned').length,
      lastReady = Math.max(
        0,
        ...S.houses
          .filter((h) => h.status !== 'owned')
          .map((h) => pl.purchase[h.id])
          .filter(isFinite),
      );
    const extraCash = S.p
      ? Math.max(0, pl.outsideTotal - (+S.p.cash || 0))
      : 0; /* the cash beyond your savings the plan needs: the headline and Checks say the same thing */
    const headline = nPl
      ? pl.unfunded.length
        ? `${n - nPl ? n - nPl + ' bought. ' : 'Nothing bought yet. '}${nPl - pl.unfunded.length} of ${nPl} planned ${nPl === 1 ? 'is' : 'are'} possible; ${pl.unfunded.length} cannot. `
        : `${n - nPl ? n - nPl + ' bought. ' : 'Nothing bought yet. '}${nPl === 1 ? 'The 1 planned asset is possible; it is' : extraCash > 0.5 ? 'All ' + nPl + ' planned are possible once you add ' + $f(extraCash) + ' from your own pocket; the last is' : 'All ' + nPl + ' planned are possible; the last is'} funded at <b>${mond(lastReady)}</b>. `
      : n === 1
        ? 'Your 1 asset is bought. '
        : `All ${n} assets are bought. `;
    const drv = pl
        .assetsAt(pl.planM)
        .filter((x) => !ownSn.some((o) => o.id === x.id))
        .sort((a, b) => b.equity - a.equity),
      drvOpen = !UI.coll.drivers;
    const drivers = `<button class="linkbtn leftbtn" data-coll="drivers" aria-expanded="${drvOpen}">What drives net worth ${drvOpen ? '▾' : '▸'}</button>${
      drvOpen
        ? `<div data-testid="drivers">${drv
            .slice(0, 6)
            .map(
              (d) =>
                `<div class="drv"><span>${esc(d.addr)}</span><span><b>${$f(d.equity)}</b> <small>${sn.nw > 0 ? r((d.equity / sn.nw) * 100) : 0}%</small></span></div>`,
            )
            .join(
              '',
            )}<p class="note">Equity = value − loans − credit lines drawn. A sample like this leans on a few fast-growing businesses; check the growth rate on each.</p></div>`
        : ''
    }`;
    const bar = `<div class="bar"><i class="${sn.cltv > g.cap ? 'over' : ''}" style="width:${Math.min(100, (sn.cltv / g.cap) * 100)}%"></i></div><div class="cap"><span data-k="cltv">Debt ${r(sn.cltv)}% of value</span><span>cap ${g.cap}%</span></div>`;
    const nwNow = E.todayTotals(
      S,
      pl,
      ownedAll.map((h) => h.id),
    ).nw; /* net worth NOW: bought assets + savings (one engine function, same as the Real page) */
    const plSn = pl.snap.filter((x) => x.type !== 'cash'),
      isOwnSn = (x) => S.houses.some((h) => h.id === x.id && h.status === 'owned'),
      bCf = plSn.filter(isOwnSn).reduce((a, x) => a + x.cf, 0),
      bN = plSn.filter(isOwnSn).length;
    return (
      head +
      `
    <div class="pg"><aside class="side">
    <section class="card hero" data-testid="summary"><p class="plantarget" data-testid="plan-target"><b data-testid="unit-label">${isToday() ? '2026*' : 'Future dollars'}</b>${infoBtn('units')}${isToday() ? '' : '<span class="note" data-testid="unit-foot"> each figure in the dollars of its own year</span>'}</p>
      <div class="kg herokg">
      ${kpi('kpi-networth', 'Net worth', $f(nwNow), `${n - nPl} bought${nPl ? ' · ' + nPl + ' planned' : ''}`, '', 0, `${$f(snAlt.nw)} at year ${yrs}${isToday() ? '' : ' (' + altLbl() + ')'}`, $f(sn.nw))}
      ${kpi('kpi-cashflow', 'Cash flow / mo', $s(td.cf), td.cf < -0.5 ? 'Negative income' : 'Positive total income', td.cf < -0.5 ? 'bad' : '', 1, '')}</div>
      ${fin ? `<div class="vrow big ${affS}" data-go="finances" data-testid="afford-line" role="link"><span class="vq"><b>Can I afford this?</b><span class="note">${esc(affS !== fin.status ? 'Lenders may decline a loan around ' + mond(pl.worst.month) + '.' : fin.headline.replace(/^(Yes|Tight|Not yet)\.\s*/, ''))}</span></span><span class="vgo"><span class="vchip ${affS}" data-testid="afford-chip" data-lvl="${affS === 'yes' ? 'ok' : affS === 'tight' ? 'warn' : 'bad'}">${VL[affS]}</span> ›</span></div>` : ''}
      ${(() => {
        CDEF.afford = true;
        const ao = !(UI.coll.afford === undefined ? CDEF.afford : UI.coll.afford);
        return `<button type="button" class="chip link chkbtn" data-coll="afford" aria-expanded="${ao}" data-testid="afford-details">Details ${ao ? '▾' : '▸'}</button><div class="fold" data-testid="afford-body"${ao ? '' : ' hidden'}><p class="plan-line${extraCash > 0.5 ? ' warn' : ''}" data-testid="plan-headline">${headline}</p></div>`;
      })()}</section>
    ${checks}
    <section class="card foldc" data-testid="more-figures">${(() => {
      CDEF.more = true;
      const mo = !(UI.coll.more === undefined ? CDEF.more : UI.coll.more);
      return `<button type="button" class="rowbtn" data-coll="more" aria-expanded="${mo}" data-testid="more-toggle"><span>More figures</span><span class="chev" aria-hidden="true">›</span></button><div class="fold" data-testid="more-body"${mo ? '' : ' hidden'}>`;
    })()}
      ${(() => {
        const pe = fin && fin.kpis && fin.kpis.planEnd,
          v = pe ? (isToday() ? pe.cfAfter : pe.cfAfter / E.dfac(S, pe.month)) : null;
        /* progress = the AFTER-TAX cash flow at plan end, always in today's dollars (2026*) */ return `<p class="plantarget" data-testid="cf-target"><b data-testid="cf-target-label">After-tax cash flow target $1.3M/mo (2026*)</b>${v === null || !isFinite(v) ? '' : `<span class="note" data-testid="cf-progress" data-pct="${Math.round((v / E.CF_TARGET) * 100)}"> Plan end, after tax: ${$f(v)}/mo, ${Math.round((v / E.CF_TARGET) * 100)}% of the target</span>`}</p>`;
      })()}<div class="kg">
      ${kpi('kpi-monthly', 'Total monthly payments', $f(td.payment), td.cf < -0.5 ? 'Negative income' : 'Positive total income', '', 0, '')}
      ${kpi('kpi-dscr', 'DSCR', td.dscr !== null ? r(td.dscr, 2) : '—', td.cf < -0.5 ? 'Negative income' : 'Positive total income', td.dscr !== null && td.dscr < 1 ? 'bad' : '', 1)}</div>
      ${(() => {
        const pp = S.p || {},
          inf = +pp.inflation || 0,
          open = !!UI.coll.tgt,
          snT = isToday() ? sn : snAlt,
          snF = isToday() ? snAlt : sn;
        return `<div class="tgt" data-testid="target-years"><button type="button" class="linkbtn leftbtn tgtb" data-coll="tgt" aria-expanded="${open}" data-testid="target-toggle">By year ${yrs}: ${$f(snAlt.nw)} ${isToday() ? 'in future' : "in today's"} <span class="nw">dollars ${open ? '▾' : '▸'}</span></button>${open ? `<div class="tgtf">${field('Years to reach this net worth', 'g.planYears', g.planYears, { info: 'projection' })}${S.p ? field('Cost increase / year', 'p.inflation', r(pp.inflation, 2), { suf: '%', info: 'inflation' }) : ''}</div><p class="note" data-testid="real-nw">${$f(snF.nw)} in ${yrs} year${+yrs === 1 ? '' : 's'} buys what ${$f(snT.nw)} buys today, at ${r(inf, 1)}% cost increase a year. Planned prices are today's; nothing is inflated. Change the years to move the target date.</p>` : ''}</div>`;
      })()}
    <section class="card plain" id="ledger" data-testid="ledger"><div class="row totrow" data-testid="ledger-total"><div class="r1"><span class="nm"><span class="addr">Portfolio total</span><div class="pay">${$f(td.payment)}/mo payments<br><span data-testid="total-extra" data-k="tot">${$f(totNow)}/mo extra now${totLater > 0.5 ? ' · +' + $f(totLater) + ' later' : ''}</span></div></span><span class="cfl ${td.cf < 0 ? 'bad' : 'ok'}"><b data-testid="total-cf">${$s(td.cf)}/mo</b><small>${td.cf < -0.5 ? 'Negative income' : 'Positive income'}</small></span></div></div></section>
    </div></section>${soldSecP}</aside>
    <div class="mainc">
    <div class="listh"><h2>The buy order</h2></div>
    ${plannedSecs}
    <section class="card" data-testid="plan-card"><b>Portfolio breakdown</b> <span class="note">${nPl} asset${nPl === 1 ? '' : 's'} · ${noStart ? 'no purchase can be funded' : 'last purchase ' + mond(pl.lastBuy)}${infoBtn('planpace')}</span>
      ${bar}<p class="note" data-testid="bd-unit">${isToday() ? '2026*' : 'Future dollars'}: value and equity at the end of the plan (${dtm(pl.planM)}); cash flow today. Planned prices are today's prices; nothing is inflated.</p>${breakdown}
      ${homeWarn}${sn.cash > 0.5 ? `<p class="note" data-testid="cash-note">Trust cash = cash the trust holds: what is kept after selling costs and the loan payoff, and pooled cash flow not yet spent${infoBtn('cashfromselling')}. It counts in net worth.</p>` : ''}${drivers}
      <div class="seg" role="tablist"><button data-tab="timeline" class="${tab === 'timeline' && UI.open ? 'on' : ''}" data-testid="timeline-toggle">Timeline</button><button data-tab="nw" class="${tab === 'nw' && UI.open ? 'on' : ''}" data-testid="networth-toggle">Net worth</button><button data-tab="hide" class="${!UI.open ? 'on' : ''}">Hide</button></div>
      ${UI.open ? (tab === 'nw' ? nwChart(pl) : timeline(pl)) : ''}</section>
    ${manage}</div></div>`
    );
  }

  /* ---------- Buy order: every planned asset in one list, across homes, commercial and businesses. The list order IS the buy order (E.reorder); an asset is never bought before one above it. ---------- */
  function orderPage() {
    const pl = PLAN(S),
      list = S.houses.filter((h) => h.status !== 'owned'),
      n = list.length;
    const rows = list
      .map((h, i) => {
        const vd = verdictFor(pl, h),
          tr = pl.trust[h.id],
          type = h.type || 'house',
          P = 'h.' + h.id + '.',
          sold = !!(pl.exits[h.id] && pl.sellAt[h.id] <= pl.planM);
        const when = !tr || !tr.ok ? 'never funded in the plan' : 'funded ' + mond(tr.month),
          why = vd.why ? ' · ' + esc(vd.why) : '';
        return `<div class="rw" data-rw="${h.id}"><div class="row ord" data-row="${h.id}" data-testid="order-row" data-pos="${i + 1}"><div class="r1"><span class="nm"><button type="button" class="draghandle" data-testid="order-handle" aria-label="Hold and drag to move ${esc(h.addr)}">⋮⋮</button><span class="addr" data-go="h/${h.id}" data-testid="order-name"><b class="bn" data-testid="order-no" aria-label="Buy number ${i + 1}">${i + 1}</b>${addrNb(h.addr, '')}</span><span class="pay"><span class="tag">${TL[type]}</span> price ${$c(h.price)}${sold ? ' · sold in the plan' : ''}</span></span></div>
        <div class="r2"><div class="fcol"><span class="locline" data-testid="order-status"><span class="vchip sm ${vd.cls}">${vd.word}</span><span class="vsep" aria-hidden="true"> · </span>${when}${why}</span></div></div>
        <div class="ordact"><button type="button" class="pbtn" data-ordmove="${h.id}:-1" data-testid="order-up" aria-label="Move ${esc(h.addr)} up" ${i === 0 ? 'disabled' : ''}>↑ Up</button><button type="button" class="pbtn" data-ordmove="${h.id}:1" data-testid="order-down" aria-label="Move ${esc(h.addr)} down" ${i === n - 1 ? 'disabled' : ''}>↓ Down</button><button type="button" class="pbtn" data-ordtop="${h.id}" data-testid="order-top" aria-label="Move ${esc(h.addr)} to the top" ${i === 0 ? 'disabled' : ''}>⤒ Top</button>
        <label class="ordto"><span class="lb">Move to #</span><input inputmode="numeric" data-num="1" data-pre="" data-suf="" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" data-testid="order-pos" data-p="${P}pos" data-k="ord-${h.id}" aria-label="Buy position for ${esc(h.addr)}" value="${i + 1}"></label></div></div></div>`;
      })
      .join('');
    return `<div class="top"><button class="ic" data-go="" aria-label="Back" data-testid="order-back">‹</button><h2>Buy order</h2></div>
    <section class="card" data-testid="order-intro"><p class="note" style="margin:0">The first asset is bought first, paid for by the trust from everything above it. Drag a row, use the arrows or type a number. Assets you already own are not in this list.</p></section>
    ${n > 1 ? '<p class="note hold ordhint" data-testid="order-hint">On a phone or tablet, press and hold a row before dragging.</p>' : ''}
    ${n ? `<section class="card ordlist" data-testid="order-list">${rows}</section>` : '<section class="card"><p class="note" style="margin:0" data-testid="order-empty">Nothing is planned yet.</p></section>'}`;
  }

  /* ---------- Saved page: portfolios kept on this device ---------- */
  const savedMemo = new Map();
  const statsOf = (rec) => {
    const k = rec.id + ':' + rec.ts + ':' + UI.unit;
    let m = savedMemo.get(k);
    if (!m) {
      try {
        const st = E.normalize(JSON.parse(JSON.stringify(rec.state)));
        if (!st.p) st.p = E.samplePersonal();
        st.p = E.normalizePersonal(st.p);
        const p = E.plan(st),
          q = E.realPlan(st, p),
          pf = UI.unit === 'future' ? p : q,
          pa = UI.unit === 'future' ? q : p;
        m = {
          n: st.houses.length,
          nw: pf.horizon.nw,
          cf: pf.horizon.cf,
          nwA: pa.horizon.nw,
          cfA: pa.horizon.cf,
          yrs: Math.round(p.planM / 12),
        };
        savedMemo.set(k, m);
      } catch (e) {
        m = null;
      }
    }
    return m;
  };
  function savedPage(pl) {
    const th = pl.horizon,
      yrs = Math.round(pl.planM / 12),
      nm = (id) => {
        const x = SAVED.find((q) => q.id === id);
        return x ? x.name : '';
      };
    const form =
      ask === 'save'
        ? `<div class="confirm" data-testid="save-form" role="group" aria-label="Save current portfolio"><label class="f"><span class="lb">Name</span><span class="iw"><input type="text" data-saved-name autocorrect="on" autocapitalize="words" spellcheck="true" autocomplete="off" enterkeyhint="done" data-testid="save-name" maxlength="60" aria-label="Name for this saved portfolio" value="${esc(saveName)}"></span></label><button class="btn" data-save-yes data-testid="save-confirm">Save</button><button class="btn plain" data-ask-cancel>Cancel</button></div>`
        : `<button class="btn" data-save-open data-testid="save-current">Save current portfolio</button>`;
    const cards = SAVED.map((rec) => {
      const m = statsOf(rec),
        id = rec.id,
        d = new Date(rec.ts);
      return `<section class="card scard" data-testid="saved-card" data-sid="${id}">
        ${ask === 'ren:' + id ? `<label class="f"><span class="lb">Name</span><span class="iw"><input type="text" data-renamed-name autocorrect="on" autocapitalize="words" spellcheck="true" autocomplete="off" enterkeyhint="done" data-testid="rename-input" maxlength="60" aria-label="New name" value="${esc(renameName)}"></span></label><button class="btn" data-ren-yes="${id}" data-testid="rename-confirm">Save name</button><button class="btn plain" data-ask-cancel>Cancel</button>` : `<b class="sname" data-testid="saved-name">${esc(rec.name)}</b>`}
        <div class="smeta" data-testid="saved-date">Saved ${isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
        ${m ? `<div class="sstat"><span data-testid="saved-assets"><b>${m.n}</b> asset${m.n === 1 ? '' : 's'}</span><span data-testid="saved-nw">Net worth <b>${$f(m.nw)}</b></span><span data-testid="saved-cf">Cash flow <b>${$s(m.cf)}/mo</b></span></div><div class="smeta" data-testid="saved-alt">${$f(m.nwA)} and ${$s(m.cfA)}/mo ${altLbl()}</div><div class="smeta" data-testid="saved-scope">whole portfolio (planned and bought) · numbers at year ${m.yrs}, in ${UNIT()}</div>` : '<p class="note">This saved portfolio could not be read.</p>'}
        ${ask === 'load:' + id ? confirmBox('Replace your working portfolio with “' + esc(rec.name) + '”? Tap Undo afterwards to get your current one back.', 'data-load-yes="' + id + '" data-testid="load-confirm"', 'Yes, open it') : ask === 'sdel:' + id ? confirmBox('Delete “' + esc(rec.name) + '”? This cannot be undone.', 'data-sdel-yes="' + id + '" data-testid="delete-confirm"', 'Yes, delete') : `<div class="sact"><button class="btn" data-load="${id}" data-testid="saved-open">Open</button><button class="pbtn" data-rename="${id}" data-testid="saved-rename">Rename</button><button class="pbtn" data-sdup="${id}" data-testid="saved-duplicate">Duplicate</button><button class="pbtn" data-sdel="${id}" data-testid="saved-delete">Delete</button></div>`}</section>`;
    }).join('');
    return `<div class="sec">Saved portfolios${infoBtn('saved')}</div><section class="card" data-testid="save-card"><p class="note" style="margin:4px 0 8px" data-testid="save-now">Working portfolio now (whole portfolio, planned and bought): ${S.houses.length} asset${S.houses.length === 1 ? '' : 's'} · net worth ${$f(th.nw)} · cash flow ${$s(th.cf)}/mo in year ${yrs} (${UNIT()}). The Planned and Real pages each show their own part of this.</p>${savedMsg ? `<div class="warnbox okbox" data-testid="saved-msg">${esc(savedMsg)}</div>` : ''}${form}</section>
      ${SAVED.length ? cards : '<p class="note" style="margin:8px 4px" data-testid="saved-empty">Nothing saved yet.</p>'}
      ${SAVED.length ? '<p class="note" style="margin:0 4px">Stays on this device and in your backup. Opening one replaces your portfolio; Undo brings it back.</p>' : ''}<section class="card" data-testid="clear-card"><b class="sn">Planned portfolio</b><p class="note" style="margin:4px 0 8px">${planCount()} planned asset${planCount() === 1 ? '' : 's'} in the working portfolio.</p>${ask === 'clearplan' ? clearBox() : `<button class="btn danger-o" data-clear-ask data-testid="saved-clear-plan">Remove every planned asset</button>`}</section>`; /* the saved list comes before the destructive clear-the-plan card */
  }

  /* ---------- house page ---------- */
  function house(h) {
    const pl = PLAN(S),
      v = pl.V[h.id],
      g = S.g,
      a = E.afford(S, h, pl),

  /* ---------- finances page: your jobs, cash and expenses, and whether the plan is affordable ---------- */
  function finChart(f) {
    const T = f.T,
      tot = f.series.total.slice(0, T + 1),
      rsv = f.series.reserve.slice(0, T + 1);
    const W = 340,
      Hh = 170,
      pad = 10,
      min = Math.min(0, ...tot, ...rsv),
      max = Math.max(1, ...tot, ...rsv);
    const x = (t) => pad + (t / T) * (W - 2 * pad),
      y = (v) => Hh - 24 - ((v - min) / (max - min || 1)) * (Hh - 44);
    const path = (arr) => {
      let d = '';
      const st = Math.max(1, Math.ceil(T / 160));
      for (let t = 0; t <= T; t += st) d += (d ? 'L' : 'M') + x(t).toFixed(1) + ' ' + y(arr[t]).toFixed(1);
      return d + 'L' + x(T).toFixed(1) + ' ' + y(arr[T]).toFixed(1);
    };
    const ys = T <= 60 ? 1 : T <= 120 ? 2 : 5;
    let ticks = '';
    for (let yr = 0; yr * 12 <= T; yr += ys)
      ticks += `<text x="${x(yr * 12)}" y="${Hh - 8}" text-anchor="${yr === 0 ? 'start' : 'middle'}">${yr ? yr + 'y' : 'Now'}</text>`;
    const mm0 =
      f.kpis.minLiquidMonth <= T
        ? `<circle class="lowpt" cx="${x(f.kpis.minLiquidMonth)}" cy="${y(tot[f.kpis.minLiquidMonth])}" r="5"><title>Lowest cash: ${mond(f.kpis.minLiquidMonth)}</title></circle>`
        : '';
    return `<div class="chartwrap"><svg class="nw" data-testid="cash-chart" viewBox="0 0 ${W} ${Hh}" data-w="${W}" data-h="${Hh}" data-pad="${pad}" data-t="${T}" data-min="${min}" data-max="${max}" data-nw="${tot.map((v) => Math.round(v)).join(',')}" data-ev="" role="img" aria-label="Your cash over time. Lowest point ${$f(f.kpis.minLiquid)} ${f.kpis.minLiquidMonth <= 0 ? 'today' : 'in ' + mond(f.kpis.minLiquidMonth)}. Hover or drag to read values.">
      <line class="ax" x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}"/><path class="rs" d="${path(rsv)}"/><path class="ln" d="${path(tot)}"/>${mm0}${ticks}
      <text x="${pad}" y="12">${$f(max)}</text>${min < 0 ? `<text x="${pad}" y="${y(min) - 4}">${$f(min)}</text>` : ''}
      <line class="xh" id="nwx" y1="14" y2="${Hh - 24}" x1="0" x2="0" visibility="hidden"/><circle class="hv" id="nwd" r="5.5" cx="0" cy="0" visibility="hidden"/><rect class="hit" x="0" y="0" width="${W}" height="${Hh}"/></svg>
      <div class="tip" id="nwtip" hidden></div></div><p class="note">Solid line: your cash. Dashed line: the reserve you want to keep.</p>`;
  }

    <div class="sec">Your month: now and at plan end</div><section class="card">${picture}${jobNote}<p class="note">Cash flow the trust reinvests, and the job money above, move out of your cash into the trust or its loans each month; that is already taken out under Cash over time.</p>

    <details class="card" data-testid="model-notes" style="margin:0 0 8px;padding:10px 12px"><summary style="cursor:pointer;font-weight:600">How the numbers are built</summary><ul class="note" style="margin:8px 0 0 16px;padding:0">
      <li>The main screen has three pages. Planned is the plan and its math (net worth and cash flow at the end of the plan, every planned asset). Real is only what you have already bought: its totals are the sum of its rows. Saved holds copies of whole portfolios (assets, assumptions and finances) that you can open later; they are kept on this device and are part of the backup. Choose which page opens first at the top of this screen.</li>

      <li>Where the money goes, in order: (1) the trust's pooled cash flow pays the line of credit down; (2) while a planned asset is waiting, the rest is held as cash for it; (3) once nothing is left to buy, each asset's profit pays down its own loan as an automatic extra payment (in proportion to the profit it earned), so its payoff comes sooner. Your job's take-home pay minus living costs, other debts and your extra payments is split the same way (equally across the loans at the end), and it never takes your cash below the emergency cushion. Both can be switched off under Paying loans down.</li>
      <li>Debt-to-income counts 75% of rent (minus the property's payment) plus your other debts and your own rent or mortgage (set in Finances). Banks also look at each asset's DSCR (income over loan payment): about 1.25 for bank loans, 1.15 for SBA.</li>

      return;
    }
    if (t.dataset.copybackup !== undefined) {
      const m = document.getElementById('cbm'),
        ta = document.getElementById('bkout');
      const fail = () => {
        ta.focus();
        ta.select();
        m.textContent = 'Select the text above and copy it by hand.';
      };
      try {
        navigator.clipboard.writeText(ta.value).then(() => {
          m.textContent = 'Copied.';
        }, fail);
      } catch (x) {
        fail();
      }
      return;
    }
    if (t.dataset.restoreText !== undefined) {
      const ta = document.getElementById('bkin');
      stageBackup(ta ? ta.value : '');
      return;
    }
    if (t.dataset.importYes !== undefined) {
      safeCopy('before restoring a backup');
      logEv('import', 'backup restored');
      const bk = { saved: pendingImport.saved, openOn: pendingImport.openOn, exOv: pendingImport.exOv };
      S = E.normalize(pendingImport);
      delete S.saved;
      delete S.openOn;
      delete S.exOv;
      if (EXED && bk.exOv && typeof bk.exOv === 'object') {
        try {
          exStoreOK = E.exImport(bk.exOv, localStorage);
        } catch (e2) {
          exStoreOK = false;
        }
      }
      /* an old backup without example edits leaves the ones on this device alone */ if (!S.p)
        S.p = E.samplePersonal();
      S.v = DATA_V;
      E.applyAdditions(S);
      fixOrder(S);
      if (Array.isArray(bk.saved)) {
        SAVED = cleanSaved(bk.saved);
        saveSaved();
      }
      if (PAGES.indexOf(bk.openOn) >= 0) UI.openOn = bk.openOn;
      page = UI.openOn;
      pendingImport = null;
      notice = '';
      save();
      goto('');
      render();
      return;
    }
    {
      const bt = t.closest('button') || t,
        sc = SCN.find((x) => bt.dataset[x.k] !== undefined || bt.dataset[x.k + 'Yes'] !== undefined);
      if (sc) {
        if (bt.dataset[sc.k + 'Yes'] !== undefined) loadScenario(sc);
        else {
          ask = sc.k;
          render();
        }
        return;
      }
    }
    const om = t.closest('[data-ordmove]');
    if (om) {
      const [id, d] = om.dataset.ordmove.split(':'),
        ids = E.plannedIds(S),
        i = ids.indexOf(id),
        j = i + +d;
      if (i >= 0 && j >= 0 && j < ids.length) {
        const before = JSON.stringify(S),
          hh = H(id),
          r0 = E.moveTo(S, id, j + 1);
        if (r0.changed) {
          setUndo({
            text: 'Moved ' + hh.addr + ' to #' + r0.pos + '. Every number is updated.',
            label: hh.addr,
            snap: before,
            order: true,
          });
          save();
        }
        render();
        const nb =
          app.querySelector(`[data-ordmove="${id}:${d}"]`) ||
          app.querySelector(`[data-ordmove="${id}:${-d}"]`);
        if (nb && !nb.disabled) nb.focus();
      }
      return;
    }
    const ot = t.closest('[data-ordtop]');
    if (ot) {
      const id = ot.dataset.ordtop,
        hh = H(id),
        before = JSON.stringify(S),
        r0 = E.moveTo(S, id, 1);
      if (r0.changed) {
        setUndo({
          text: 'Moved ' + hh.addr + ' to the top (#1). Every number is updated.',
          label: hh.addr,
          snap: before,
          order: true,
        });
        save();
      }
      render();
      return;
    }
    const mvb = t.closest('[data-move]');
    if (mvb) {
      const [id, d] = mvb.dataset.move.split(':');
      moveBy(id, +d);
      return;
    }
    const dpb = t.closest('[data-dup]');
    if (dpb) {
      const c = E.duplicate(S, dpb.dataset.dup);
      if (c) {
        ask = null;
        UI.coll['cat-' + (c.type || 'house')] = false;
        save();
        if (routeOf().startsWith('h/')) {
          selId = null;
          goto('h/' + c.id);
        } else {
          selId = c.id;
          page = 'planned';
          /* the copy is always planned */ render();
        }
      }
      return;
    }
    const rwEl = t.closest('[data-row]');
    if (rwEl && !t.closest('[data-go]') && !t.closest('.panel')) {
      if (Date.now() - lastDragEnd < 350) return;
      if (t.closest('[data-panel]')) {
        selId = selId === rwEl.dataset.row ? null : rwEl.dataset.row;
        ask = null;
        render();
        return;
      }
      if (!t.closest('select,input,textarea,a,[data-info],button:not(.addrbtn)')) {
        goto('h/' + rwEl.dataset.row);
        return;
      }
    }
    const go = t.closest('[data-go]');
    if (go) goto(go.dataset.go);
  });
  /* ---------- reorder: Move up/down buttons and press-and-hold drag. List order = buy order; the trust funds each asset from everything before it, so nothing needs relinking. ---------- */
  let lastDragEnd = 0,
    drag = null,
    press = null,
    navSeen = 0;
  const visibleIds = (h0) => {
    const pl = E.plan(S);
    return S.houses
      .filter(
        (x) =>
          (x.type || 'house') === (h0.type || 'house') &&
          (x.status === 'owned') === (h0.status === 'owned') &&
          !(pl.exits[x.id] && pl.sellAt[x.id] <= pl.planM),
      )
      .map((x) => x.id);
  }; /* the rows of one list: same kind of asset, bought or planned */
  function moveBy(id, d) {
    const h = H(id);
    if (!h) return;
    const vis = visibleIds(h),
      i = vis.indexOf(id),
      j = i + d;
    if (i < 0 || j < 0 || j >= vis.length) return;
    const before = JSON.stringify(S);
    [vis[i], vis[j]] = [vis[j], vis[i]];
    E.reorder(S, vis);
    setUndo({
      text: 'Moved ' + h.addr + ' ' + (d < 0 ? 'up' : 'down') + '. Every number below it is updated.',
      label: h.addr,
      snap: before,
      order: true,
    });
    save();
    render();
    const nb =
      app.querySelector(`[data-move="${id}:${d}"]`) || app.querySelector(`[data-move="${id}:${-d}"]`);
    if (nb && !nb.disabled) nb.focus();
  }
  const LONG = 400;
  const clearPress = () => {
    document.querySelectorAll('.rw.pressing').forEach((el) => el.classList.remove('pressing'));
  }; /* the 'about to lift' tint */
  function startDrag() {
    if (!press) return;
    const row = press.el,
      wrap = row.closest('.rw'),
      body = wrap && wrap.parentElement;
    if (!body) {
      press = null;
      return;
    }
    app.classList.add('dragmode'); /* open panels fold away so every row is the same size while it moves */
    const items = [...body.children].filter((c) => c.classList && c.classList.contains('rw')),
      sy = window.scrollY;
    const rects = items.map((el) => ({ el, top: el.getBoundingClientRect().top + sy, h: el.offsetHeight })),
      idx = items.indexOf(wrap);
    drag = {
      id: press.id,
      items,
      rects,
      idx,
      to: idx,
      h: rects[idx].h,
      off: press.y + sy - rects[idx].top,
      y: press.y,
      wrap,
    };
    clearPress();
    wrap.classList.add('lift');
    try {
      row.setPointerCapture(press.pid);
    } catch (e) {}
    if (body.classList.contains('ordlist')) {
      drag.line = document.createElement('div');
      drag.line.className = 'dropline';
      drag.line.setAttribute('data-testid', 'drop-line');
      drag.bodyTop = body.getBoundingClientRect().top + sy;
      body.appendChild(drag.line);
    } /* the drop indicator: a line where the row will land */
    selId = null;
    ask = null;
    press = null;
    dragLoop();
  }
  function dragUpdate() {
    const d = drag;
    if (!d) return;
    const sy = window.scrollY,
      first = d.rects[0].top,
      last = d.rects[d.rects.length - 1].top + d.rects[d.rects.length - 1].h - d.h;
    const top = Math.min(last, Math.max(first, d.y + sy - d.off));
    d.wrap.style.transform = `translateY(${top - d.rects[d.idx].top}px)`;
    const c = d.y + sy;
    let to = 0;
    /* where the finger is, not the dragged row's centre: rows differ in height, so a taller row could never pass a shorter one above it */ d.rects.forEach(
      (r, j) => {
        if (j !== d.idx && r.top + r.h / 2 < c) to++;
      },
    );
    d.to = to;
    if (d.line)
      d.line.style.top = (to > d.idx ? d.rects[to].top + d.rects[to].h : d.rects[to].top) - d.bodyTop + 'px';
    d.rects.forEach((r, j) => {
      if (j === d.idx) return;
      const sh = d.idx < to && j > d.idx && j <= to ? -d.h : d.idx > to && j >= to && j < d.idx ? d.h : 0;
      r.el.style.transform = sh ? `translateY(${sh}px)` : '';
    });
  }
  function dragLoop() {
    if (!drag) return;
    const z = 90,
      y = drag.y,
      H0 = window.innerHeight;
    let v = 0;
    if (y < z) v = -Math.min(18, (z - y) / 4);
    else if (y > H0 - z) v = Math.min(18, (y - (H0 - z)) / 4);
    if (v) window.scrollBy(0, v);
    dragUpdate();
    drag.raf = requestAnimationFrame(dragLoop);
  }
  function endDrag(commit) {
    const d = drag;
    drag = null;
    press = null;
    if (!d) return;
    cancelAnimationFrame(d.raf);
    d.items.forEach((el) => {
      el.style.transform = '';
      el.classList.remove('lift');
    });
    app.classList.remove('dragmode');
    lastDragEnd = Date.now();
    if (commit && d.to !== d.idx) {
      const ids = d.items.map((el) => el.dataset.rw),
        before = JSON.stringify(S),
        mv = H(d.id);
      ids.splice(d.to, 0, ids.splice(d.idx, 1)[0]);
      if (E.reorder(S, ids))
        setUndo({
          text: 'Moved ' + (mv ? mv.addr : 'an asset') + '. Every number below it is updated.',
          label: mv ? mv.addr : 'asset',
          snap: before,
          order: true,
        });
      save();
    }
    render();
  }
  app.addEventListener('pointerdown', (e) => {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const row = e.target.closest && e.target.closest('.row[data-row]');
    if (!row || row.hasAttribute('data-nodrag') || e.target.closest('select,input,textarea,a,[data-info]'))
      return;
    if (row.hasAttribute('data-handle') && !e.target.closest('.draghandle')) return;
    if (row.classList.contains('ord') && e.target.closest('button:not(.draghandle),label'))
      return; /* Buy order rows: hold anywhere on the row, except on its own buttons and box */
    clearTimeout(press && press.timer);
    clearPress();
    press = {
      id: row.dataset.row,
      el: row,
      x: e.clientX,
      y: e.clientY,
      pid: e.pointerId,
      mouse: e.pointerType === 'mouse' && row.classList.contains('ord'),
    };
    press.timer = setTimeout(startDrag, LONG);
    if (row.classList.contains('ord')) row.closest('.rw').classList.add('pressing');
  });
  document.addEventListener('pointermove', (e) => {
    if (drag) {
      drag.y = e.clientY;
      dragUpdate();
      return;
    }
    if (press && press.mouse && e.buttons & 1 && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 4) {
      clearTimeout(press.timer);
      startDrag();
      drag.y = e.clientY;
      dragUpdate();
      return;
    } /* a mouse on the Buy order page drags at once: no hold needed */
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) {
      clearTimeout(press.timer);
      press = null;
      clearPress();
    }
  });
  const pend = (commit) => (e) => {
    if (drag) {
      if (e.type === 'pointerup') {
        drag.y = e.clientY;
        dragUpdate();
      }
      endDrag(commit);
    } else if (press) {
      clearTimeout(press.timer);
      press = null;
      clearPress();
    }
  };
  document.addEventListener('pointerup', pend(true));
  document.addEventListener('pointercancel', pend(false));
  document.addEventListener(
    'touchmove',
    (e) => {
      if (drag && e.cancelable) e.preventDefault();
    },
    { passive: false },
  ); /* iOS: stop the page scrolling under the dragged row */
  app.addEventListener('contextmenu', (e) => {
    if (e.target.closest && e.target.closest('.row[data-row]')) e.preventDefault();
  });

  /* ---------- touch gestures: swipe right from the left edge = back; swipe down = close the keyboard ---------- */
  function swipeBack() {
    if (infoKey) {
      closeInfo();
      return;
    }
    if (exEdit && routeOf() === 'add' && !UI.addOwned) {
      exBack();
      return;
    }
    if (!routeOf()) return;
    if (navSeen > 0 && history.length > 1) history.back();
    else goto('');
  }
  let sw = null,
    kb = null,
    pgSw = null;
  const FIELD =
    'input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select';
  document.addEventListener(
    'touchstart',
    (e) => {
      const t = e.touches[0];
      sw = null;
      kb = null;
      if (!t || e.touches.length !== 1) return;
      if (
        t.clientX <= 24 &&
        !drag &&
        !(e.target.closest && e.target.closest('input,select,textarea,[type=range],.infopop'))
      )
        sw = { x: t.clientX, y: t.clientY };
      if (!(e.target.closest && e.target.closest(FIELD))) kb = { y: t.clientY };
      pgSw =
        !routeOf() &&
        t.clientX > 24 &&
        !drag &&
        !infoKey &&
        !(
          e.target.closest &&
          (e.target.closest('input,select,textarea,[type=range],.infopop,svg.nw,.panel') ||
            (e.target.closest('.row') && !e.target.closest('.totrow')))
        )
          ? { x: t.clientX, y: t.clientY }
          : null; /* the total row is not draggable, so a sideways swipe on it still changes the page */
    },
    { passive: true },
  );
  document.addEventListener(
    'touchmove',
    (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (sw && (Math.abs(t.clientY - sw.y) > 45 || drag)) sw = null;
      if (pgSw && (Math.abs(t.clientY - pgSw.y) > 45 || drag)) pgSw = null;
      const a = document.activeElement;
      if (kb && a && a.matches && a.matches(FIELD) && t.clientY - kb.y > 28 && !drag) {
        kb = null;
        a.blur();
      }
    },
    { passive: true },
  );
  document.addEventListener(
    'touchend',
    (e) => {
      const t = e.changedTouches[0];
      if (sw && t && t.clientX - sw.x > 70 && Math.abs(t.clientY - sw.y) < 45 && !drag) swipeBack();
      else if (
        pgSw &&
        t &&
        !routeOf() &&
        Math.abs(t.clientX - pgSw.x) > 70 &&
        Math.abs(t.clientY - pgSw.y) < 45 &&
        !drag
      ) {
        const i = PAGES.indexOf(page) + (t.clientX < pgSw.x ? 1 : -1);
        if (i >= 0 && i < PAGES.length) showPage(PAGES[i]);
      }
      sw = null;
      kb = null;
      pgSw = null;
    },
    { passive: true },
  );
  document.addEventListener(
    'touchcancel',
    () => {
      sw = null;
      kb = null;
      pgSw = null;
    },
    { passive: true },
  );
  app.addEventListener('keydown', (e) => {
    if (
      e.key === 'Enter' &&
      e.target.tagName === 'INPUT' &&
      !/^(checkbox|radio|file|range)$/.test(e.target.type)
    )
      e.target.blur();
  });

  window.addEventListener('storage', (e) => {
    if (!EXED || (e.key !== null && e.key !== E.EXKEY)) return;
    try {
      E.exLoad(localStorage);
    } catch (x) {}
    const a = document.activeElement;
    if (routeOf() === 'add' && !(a && a.tagName === 'INPUT')) render();
  }); /* another tab changed the example edits: read them again (validated) */
  render();
  STARTED = true;
  act('route ' + routeSafe());
  /* local-first plumbing: ask the browser to keep our data, and cache the app for offline use */
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) {}
  
  window.__app = {
    get state() {
      return S;
    },
    get renders() {
      return RN;
    },
    get softRenders() {
      return SRN;
    },
    stamps: STAMPS,
    get bootMs() {
      return DIAG_MS;
    },
    get monMs() {
      return MON_MS;
    },
    get mixed() {
      return MIXED;
    },
    check: () => {
      runMonitor();
      return ANOM.slice();
    },
    report: (nums) => makeReport(!!nums).text,
    get diag() {
      return DG;
    },
  }; /* read-only handles for the graders */
})();

</script>
